px\">\n        <sc-for list=\"{{ incidencias }}\" as=\"i\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n              <span style=\"font-size:14px;font-weight:600;color:#2C2E30\">{{ i.grupo }}<\u002Fspan>\n              <span style=\"font-size:14px;font-weight:800;font-variant-numeric:tabular-nums\">{{ i.pct }}%<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:6px;background:#E1DACE\"><div style=\"height:6px;background:#8A3B22;width:{{ i.w }}%\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:16px 0 0;font-size:12px;line-height:1.55;color:#6B6660\">Son porcentajes estimados a partir de lo que elegiste, sobre una distribución de referencia. Se ajustan cuando definamos terreno, sistema constructivo y terminaciones.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ programaIncompleto }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:64px;background:#E4DED2;border-left:4px solid #8A3B22;padding:30px 32px\">\n      <p style=\"margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8A3B22\">Falta lo esencial<\u002Fp>\n      <p style=\"margin:0;max-width:64ch;font-size:16px;line-height:1.55;color:#2C2E30\">Como {{ faltaTexto }}, no tiene sentido estimar la obra: cualquier número que pongamos sería inventado. Volvé a ese bloque y completalo, y la estimación aparece sola.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ mostrarCosto }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-g=\"pad\" style=\"margin-top:64px;background:#15171A;color:#EFEBE3;padding:44px 40px\">\n      <p style=\"margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#C4B7A6\">Inversión preliminar estimada<\u002Fp>\n      <div data-g=\"costo\" style=\"font-size:56px;font-weight:900;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums\">{{ costoRange }}<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:20px 32px;margin-top:26px;border-top:1px solid #33342F;padding-top:20px\">\n        <div>\n          <div style=\"font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A8378\">Superficie computable<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:800;margin-top:4px\">{{ supComputable }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A8378\">Gama elegida<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:800;margin-top:4px\">{{ gamaNombre }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A8378\">Referencia de esa gama<\u002Fdiv>\n          <div style=\"font-size:20px;font-weight:800;margin-top:4px\">{{ gamaValorLinea }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:22px 0 0;max-width:78ch;font-size:13px;line-height:1.6;color:#A9A296\">Esta estimación combina la superficie computable de tu programa con el nivel de terminaciones y prestaciones seleccionado. No constituye un presupuesto de obra.{{ notaPileta }}<\u002Fp>\n    <\u002Fdiv>\n\n    <div data-g=\"pad\" style=\"margin-top:0;border:2px solid #15171A;border-top:0;background:#F7F4EE;padding:36px 40px\">\n      <p style=\"margin:0 0 6px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">La misma superficie, cinco niveles de inversión<\u002Fp>\n      <p style=\"margin:0 0 20px;max-width:66ch;font-size:15px;line-height:1.55;color:#4A4A46\">Para que puedas dimensionar cuánto inciden las decisiones de terminaciones y equipamiento, aplicamos las cinco referencias a la misma superficie de tu programa.<\u002Fp>\n      <div data-g=\"gamas\" style=\"display:flex;flex-direction:column;margin-left:-16px;margin-right:-16px\">\n        <sc-for list=\"{{ gamaComparacion }}\" as=\"g\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;gap:16px;justify-content:space-between;align-items:baseline;flex-wrap:wrap;padding:14px 16px;background:{{ g.bg }};color:{{ g.fg }};border-bottom:1px solid #D5CEC2\">\n            <div style=\"min-width:180px\">\n              <div style=\"font-size:17px;font-weight:900;letter-spacing:-.015em\">{{ g.nombre }}<\u002Fdiv>\n              <div style=\"font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:{{ g.sub }};margin-top:3px\">{{ g.etiqueta }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;font-weight:700;color:{{ g.sub }};white-space:nowrap\">{{ g.valorM2 }}<\u002Fdiv>\n            <div style=\"font-size:19px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums\">{{ g.total }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hayReserva }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:14px 0 0;font-size:13px;line-height:1.55;color:#6B6660;max-width:70ch\">Las cinco cifras incluyen la reserva de {{ infReserva }} por construir en etapas, igual que el total de arriba.<\u002Fp>\n      <\u002Fsc-if>\n      <p style=\"margin:22px 0 8px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8A3B22\">Cuánto pesa cada salto<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <sc-for list=\"{{ gamaSaltos }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap;font-size:14px;line-height:1.5;border-bottom:1px solid #E1DACE;padding-bottom:7px\">\n            <span style=\"font-weight:800\">{{ s.paso }}<\u002Fspan>\n            <span style=\"color:#6B6660\">{{ s.porM2 }} · {{ s.total }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-g=\"pad\" style=\"margin-top:24px;background:#E4DED2;border-left:4px solid #8A3B22;padding:30px 32px\">\n      <p style=\"margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8A3B22\">Los m² no definen solos el costo<\u002Fp>\n      <p style=\"margin:0;max-width:70ch;font-size:15px;line-height:1.55;color:#2C2E30\">La superficie define la escala de la vivienda. El costo final depende también de qué colocamos dentro de esos metros: aberturas, terminaciones, instalaciones, climatización, equipamiento, complejidad constructiva y nivel de personalización.<\u002Fp>\n      <p style=\"margin:12px 0 0;max-width:70ch;font-size:15px;line-height:1.55;color:#2C2E30\">Por eso esta herramienta separa dos decisiones diferentes: cuánta superficie necesita tu programa y con qué nivel de prestaciones imaginás construirla.<\u002Fp>\n    <\u002Fdiv>\n\n    <div data-g=\"pad\" style=\"margin-top:24px;border:1px solid #D5CEC2;background:#F7F4EE;padding:28px 32px\">\n      <p style=\"margin:0 0 6px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8A3B22\">Referencia institucional<\u002Fp>\n      <p style=\"margin:0 0 4px;font-size:15px;font-weight:700\">Valor de referencia publicado por CAUBA<\u002Fp>\n      <p style=\"margin:0;font-size:26px;font-weight:900;letter-spacing:-.025em\">{{ caubaLinea }}<\u002Fp>\n      <p style=\"margin:6px 0 0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6B6660\">{{ caubaFuente }}<\u002Fp>\n      <p style=\"margin:16px 0 0;max-width:74ch;font-size:13px;line-height:1.6;color:#4A4A46\">Este valor se muestra como referencia institucional del costo de construcción. No se utiliza como único parámetro para estimar tu vivienda, porque dos obras de igual superficie pueden tener costos diferentes según sus terminaciones, instalaciones, equipamiento y nivel de complejidad. El dato es público y se puede consultar en <a href=\"https://www.capbacs.com/indicadores-cauba\" target=\"_blank\" rel=\"noopener\">capbacs.com/indicadores-cauba<\u002Fa>.<\u002Fp>\n      <p style=\"margin:14px 0 0;max-width:74ch;font-size:12px;line-height:1.65;color:#6B6660;border-top:1px solid #D5CEC2;padding-top:14px\">Las gamas Base, Media, Media alta, Alta y Premium son referencias propias del estudio, no valores publicados por CAUBA. El costo real depende de la ubicación, el sistema constructivo, el terreno, el proyecto definitivo, los proveedores y el momento de ejecución.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div data-g=\"pad\" style=\"margin-top:64px;border:2px solid #15171A;background:#F7F4EE;padding:36px 34px;display:flex;flex-direction:column;gap:16px;align-items:flex-start\">\n    <p style=\"margin:0;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8A3B22\">Tu informe<\u002Fp>\n    <h2 style=\"margin:0;font-size:30px;font-weight:900;letter-spacing:-.025em;max-width:24ch\">El documento completo ya está armado con tus respuestas<\u002Fh2>\n    <p style=\"margin:0;max-width:62ch;font-size:16px;line-height:1.55;color:#4A4A46\">Programa ambiente por ambiente, los supuestos de cada superficie, la referencia de obra y lo que conviene definir antes de proyectar.<\u002Fp>\n    <button sc-camel-on-click=\"{{ verInforme }}\" style=\"cursor:pointer;background:#15171A;border:2px solid #15171A;color:#F7F4EE;padding:16px 32px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Ver el informe<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:44px;align-items:start\">\n    <div>\n      <h2 style=\"margin:0 0 18px;font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid #D5CEC2;padding-bottom:12px\">Cómo trabajamos<\u002Fh2>\n      <p style=\"margin:0 0 24px;font-size:15px;line-height:1.55;color:#3A3A38\">El Método Full House se recorre en tres niveles. Cada uno se apoya en las decisiones del anterior, y vos decidís si avanzar con el proceso completo o nivel a nivel.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;gap:16px;align-items:baseline\">\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:.1em;color:#8A3B22;min-width:58px\">Nivel 1<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Anteproyecto<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.5;color:#4A4A46\">Definimos el concepto, la implantación, el funcionamiento, la imagen y la superficie real de la casa. Incluye plantas, cortes y vistas, renders ilustrativos y lista de cantidades. Es la columna vertebral de todo: 30 días hábiles.<\u002Fspan>\n            <a href=\"{{ waN1 }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;margin-top:6px;display:inline-block;background:transparent;color:#8A3B22;border:1px solid #C9BBA9;border-bottom:1px solid #C9BBA9;padding:9px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase\" style-hover=\"background:#8A3B22;color:#F7F4EE;border-color:#8A3B22\">Quiero consultar por el Nivel 1<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:baseline\">\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:.1em;color:#8A3B22;min-width:58px\">Nivel 2<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Proyecto<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.5;color:#4A4A46\">Documentación en 1:50 con ejes y niveles, renders realistas, predimensionado de estructura, definición de materialidad y planilla de aberturas. 40 días hábiles.<\u002Fspan>\n            <a href=\"{{ waN2 }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;margin-top:6px;display:inline-block;background:transparent;color:#8A3B22;border:1px solid #C9BBA9;border-bottom:1px solid #C9BBA9;padding:9px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase\" style-hover=\"background:#8A3B22;color:#F7F4EE;border-color:#8A3B22\">Quiero consultar por el Nivel 2<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:baseline\">\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:.1em;color:#8A3B22;min-width:58px\">Nivel 3<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Legajo<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.5;color:#4A4A46\">La documentación ejecutiva con la que se construye: estructura, replanteos, instalaciones y cantidades de materiales. 20 días hábiles.<\u002Fspan>\n            <a href=\"{{ waN3 }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;margin-top:6px;display:inline-block;background:transparent;color:#8A3B22;border:1px solid #C9BBA9;border-bottom:1px solid #C9BBA9;padding:9px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase\" style-hover=\"background:#8A3B22;color:#F7F4EE;border-color:#8A3B22\">Quiero consultar por el Nivel 3<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-g=\"pad\" style=\"background:#E4DED2;padding:30px 28px\">\n      <h2 style=\"margin:0 0 12px;font-size:22px;font-weight:800;letter-spacing:-.02em\">Conversemos tu proyecto<\u002Fh2>\n      <p style=\"margin:0 0 20px;font-size:15px;line-height:1.55;color:#3A3A38\">Escribirnos no te compromete a nada. Las escalas de honorarios se conocen antes de contratar, y si decidís continuar, lo que abonaste por el Anteproyecto se acredita al servicio completo.<\u002Fp>\n      <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;background:#8A3B22;color:#F7F4EE;border:0;border-bottom:0;padding:16px 28px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Escribir por WhatsApp<\u002Fa>\n      <p style=\"margin:18px 0 0;font-size:14px;line-height:1.5;color:#4A4A46\">O por correo, a <a href=\"{{ mailLink }}\">{{ email }}<\u002Fa>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:44px;align-items:start;border-top:1px solid #D5CEC2;padding-top:28px\">\n    <div>\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22\">El servicio<\u002Fspan>\n      <p style=\"margin:10px 0 0;font-size:14px;line-height:1.55;color:#4A4A46\"><strong style=\"font-weight: 700;\">Full House<\u002Fstrong> es nuestro método completo. Además de la documentación necesaria para construir, suma curaduría y definición de detalle antes de que empiece la obra: despiece de pisos y revestimientos, planos de cielorrasos, planilla de terminaciones, detalles constructivos, desarrollo completo de instalaciones y los locales húmedos resueltos en escala 1:20.<\u002Fp>\n      <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#4A4A46\">La idea es simple: cada decisión que se toma en el proyecto es una decisión que no hay que improvisar en obra, con el albañil esperando y el costo ya corriendo. Incluye reunión preobra y dos asesorías durante la ejecución.<\u002Fp>\n      <a href=\"{{ waServicio }}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:18px;display:inline-block;background:#15171A;color:#F7F4EE;border:0;border-bottom:0;padding:14px 24px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Si querés saber más, escribinos<\u002Fa>\n    <\u002Fdiv>\n    <div>\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22\">Cómo se paga el Anteproyecto<\u002Fspan>\n      <p style=\"margin:10px 0 0;font-size:14px;line-height:1.55;color:#4A4A46\">El Anteproyecto arranca con un primer pago fijo, conocido de antemano según los m2 estimados que crees necesitar pero los honorarios finales se define recién cuando el propio Anteproyecto establece la superficie real de la casa, y las escalas están a la vista antes de contratar y de avanzar en la documentación, elección de materiales y artefactos, definición de detalles, etc.<\u002Fp>\n      <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#4A4A46\">Cuando avanzamos sobre el nivel 2 de Full House, todo lo que abonaste por el Anteproyecto se acredita al honorario total. <br><br>Entrar por el Nivel 1 te permite saber si realmente tus espectativas y objetivos están alineados con nuestra filosofía sin necesidad de comprometerte con todo el proceso desde el comienzo.&nbsp;<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin:28px 0 0;font-size:13px;line-height:1.6;color:#6B6660;max-width:84ch\">No incluye dirección de obra. El cálculo estructural definitivo corresponde a un ingeniero externo. No incluye estudio de suelos. Alcances, plazos y honorarios se detallan en la propuesta.<\u002Fp>\n\n\n  <div data-g=\"pad\" style=\"margin-top:56px;background:#15171A;color:#EFEBE3;padding:48px 44px\">\n    <p style=\"margin:0 0 10px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#C4B7A6\">Nuestra filosofía y nuestra manera<\u002Fp>\n    <h2 style=\"margin:0;max-width:24ch;font-size:34px;font-weight:900;letter-spacing:-.028em;line-height:1.1\">La arquitectura no comienza dibujando una forma. Comienza comprendiendo un problema.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:32px;margin-top:36px;border-top:1px solid #33342F;padding-top:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#C86B45\">La belleza<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#C4B7A6\">No entendemos la belleza como un recurso estético agregado al final del proceso. Creemos que la belleza es inevitable cuando el diseño nace del rigor técnico, el análisis funcional y la claridad conceptual.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#C86B45\">El lujo<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#C4B7A6\">No asociamos el valor con el exceso ni con el presupuesto. La calidad de una casa está en la inteligencia de sus decisiones. Diseñamos para invertir donde realmente importa.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#C86B45\">Nuestro compromiso<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#C4B7A6\">Diseñamos viviendas honestas, precisas y atemporales. Creemos que la mejor arquitectura no busca llamar la atención: permanece porque todo en ella tiene sentido.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:32px;margin-top:32px;border-top:1px solid #33342F;padding-top:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#C86B45\">Escucharte primero<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#C4B7A6\">Antes de proyectar hay un trabajo de comprensión. Formularios específicos, como este, nos permiten entender cómo viven, qué buscan y qué imaginan quienes van a habitar la casa. Diseñamos a partir de eso, no de un supuesto nuestro.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#C86B45\">Saber siempre dónde estás<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#C4B7A6\">La estructura del método existe para eso: en qué etapa estamos, qué se está definiendo ahora, cuándo nos volvemos a reunir, con qué tema y para decidir qué. Cada reunión tiene su agenda y queda registrada.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#C86B45\">Un camino sin incertidumbre<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#C4B7A6\">Construir una casa no debería dejarte dudando si vas por el buen camino, si te estamos escuchando o si vamos a llegar a lo que buscás. Nuestro trabajo es que en cada paso sepas qué se decidió, qué queda pendiente y hacia dónde vamos.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin:56px 0 0;font-size:12px;line-height:1.65;color:#8A8378;border-top:1px solid #D5CEC2;padding-top:20px;max-width:84ch\">Esta estimación no define la mejor distribución, no verifica normativa ni es un presupuesto. Todo eso lo desarrollamos juntos durante el proyecto.<\u002Fp>\n<\u002Fdiv>\n\n\n\n\n<\u002Fsc-if><\u002Fdiv><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;marca&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sol Rodríguez Arquitectura&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5493329557152&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;rodriguezsol.arq@gmail.com&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;emailjsPublicKey&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tnjca9QdiaoAcTjT5&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;emailjsService&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;service_x81cl4i&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;emailjsTemplateEstudio&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;template_ega1pn2&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;emailjsTemplateCliente&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;template_mwjfs4i&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;gamaBase&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1000,&quot;min&quot;:300,&quot;max&quot;:6000,&quot;step&quot;:50,&quot;unit&quot;:&quot; USD/m²&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Valores por gama (USD/m²)&quot;},&quot;gamaMedia&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1200,&quot;min&quot;:300,&quot;max&quot;:6000,&quot;step&quot;:50,&quot;unit&quot;:&quot; USD/m²&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Valores por gama (USD/m²)&quot;},&quot;gamaMediaAlta&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:150 quipamiento y complejidad al mínimo necesario.\",\n    cat: {\n      \"Terminaciones\": \"Pisos y revestimientos económicos, de gama de entrada. Revestimientos únicamente en los sectores indispensables.\",\n      \"Aberturas\": \"Aberturas estándar, con dimensiones controladas.\",\n      \"Cocina y baños\": \"Artefactos sanitarios y griferías de líneas de entrada. Mobiliario fijo básico.\",\n      \"Instalaciones\": \"Instalación eléctrica esencial e instalaciones sanitarias convencionales.\",\n      \"Climatización\": \"Soluciones individuales o previsiones básicas.\",\n      \"Iluminación\": \"Puntos de luz según necesidad, sin proyecto de iluminación.\",\n      \"Exteriores\": \"Exteriores y semicubiertos con resolución sencilla.\",\n      \"Nivel de personalización\": \"Sin automatización ni sistemas especiales.\"\n    } },\n  { id: \"media\", nombre: \"Media\", valor: 1200, desde: false, sub: \"Estándar mínimo recomendado\", recomendada: true,\n    desc: \"Un estándar residencial equilibrado, con terminaciones y prestaciones medias y un nivel de confort adecuado para una vivienda permanente.\",\n    cat: {\n      \"Terminaciones\": \"Pisos y revestimientos de gama media, con mayor superficie revestida en baños y cocina.\",\n      \"Aberturas\": \"Aberturas de gama media y mejor resolución de las superficies vidriadas.\",\n      \"Cocina y baños\": \"Sanitarios y griferías de gama media. Mobiliario fijo de calidad media, con mesadas y herrajes de prestaciones intermedias.\",\n      \"Instalaciones\": \"Instalación eléctrica más completa: más circuitos, tomas y puntos de iluminación, con previsiones específicas para equipamiento.\",\n      \"Climatización\": \"Calefacción a gas por radiadores o sistema equivalente según proyecto y ubicación, con previsión para refrigeración.\",\n      \"Iluminación\": \"Mayor cantidad de puntos y circuitos independientes.\",\n      \"Exteriores\": \"Mejor resolución de galerías y espacios semicubiertos.\",\n      \"Nivel de personalización\": \"Terminaciones de catálogo, con definiciones acordadas en proyecto.\"\n    } },\n  { id: \"mediaalta\", nombre: \"Media alta\", valor: 1500, desde: false, sub: \"Mayor confort y calidad material\",\n    desc: \"Sube la calidad material y la prestación de cada componente, con más definiciones hechas a medida.\",\n    cat: {\n      \"Terminaciones\": \"Porcelanatos y revestimientos de mayor prestación y formato, con posibilidad de incorporar madera u otros materiales seleccionados.\",\n      \"Aberturas\": \"Aberturas de mayores prestaciones, DVH donde corresponda y posibilidad de paños vidriados de mayores dimensiones.\",\n      \"Cocina y baños\": \"Sanitarios y griferías de líneas superiores. Mobiliario fijo mayormente diseñado a medida, con mejores mesadas y herrajes.\",\n      \"Instalaciones\": \"Infraestructura para seguridad y conectividad.\",\n      \"Climatización\": \"Climatización integral según proyecto, con posibilidad de piso radiante o sistemas sectorizados.\",\n      \"Iluminación\": \"Proyecto de iluminación más desarrollado.\",\n      \"Exteriores\": \"Mayor calidad de terminaciones exteriores y semicubiertos.\",\n      \"Nivel de personalización\": \"Buena parte del equipamiento fijo resuelto a medida.\"\n    } },\n  { id: \"alta\", nombre: \"Alta\", valor: 1800, desde: false, sub: \"Alta prestación y personalización\",\n    desc: \"Materiales de gama superior, encuentros constructivos más complejos y equipamiento diseñado para la casa.\",\n    cat: {\n      \"Terminaciones\": \"Materiales y terminaciones de gama superior, con posibilidad de madera, piedra y revestimientos especiales. Mayor complejidad y precisión de encuentros constructivos.\",\n      \"Aberturas\": \"Aberturas de altas prestaciones y grandes superficies vidriadas donde el proyecto lo requiera.\",\n      \"Cocina y baños\": \"Sanitarios y griferías de alta gama. Mobiliario diseñado a medida con herrajes superiores.\",\n      \"Instalaciones\": \"Infraestructura avanzada de seguridad, redes y automatización.\",\n      \"Climatización\": \"Climatización integral, con mayor atención al confort térmico y acústico.\",\n      \"Iluminación\": \"Iluminación arquitectónica.\",\n      \"Exteriores\": \"Espacios exteriores con mayor nivel de desarrollo.\",\n      \"Nivel de personalización\": \"Alto: la mayoría de las piezas se definen para esta casa.\"\n    } },\n  { id: \"premium\", nombre: \"Premium\", valor: 2100, desde: true, sub: \"Alta especificación\",\n    desc: \"Productos de alta especificación, sistemas avanzados y un grado de personalización que incide de lleno en la mano de obra.\",\n    cat: {\n      \"Terminaciones\": \"Materiales naturales y productos de alta especificación, con posibilidad de productos importados o piezas especiales.\",\n      \"Aberturas\": \"Sistemas especiales o minimalistas, grandes luces y vidrios de altas prestaciones.\",\n      \"Cocina y baños\": \"Equipamiento de cocina y baños de primeras líneas. Mobiliario y elementos diseñados específicamente para la vivienda.\",\n      \"Instalaciones\": \"Domótica y automatización, seguridad y conectividad integradas, con posibilidad de sistemas energéticos especiales.\",\n      \"Climatización\": \"Sistemas avanzados de climatización.\",\n      \"Iluminación\": \"Control de iluminación.\",\n      \"Exteriores\": \"Exteriores proyectados con el mismo nivel de especificación que el interior.\",\n      \"Nivel de personalización\": \"Máximo, con mayor incidencia de mano de obra especializada.\"\n    } }\n];\nconst CAT_ORDEN = [\"Terminaciones\",\"Aberturas\",\"Cocina y baños\",\"Instalaciones\",\"Climatización\",\"Iluminación\",\"Exteriores\",\"Nivel de personalización\"];\nconst gamaDe = (id) => GAMAS.find(g => g.id === id) || GAMAS[1];\n\nconst DORM_KEYS = [\"principal\",\"individual\",\"doble\",\"infantil\",\"huespedes\",\"servicio\",\"flexible\"];\nconst DORM_LABELS = { principal:\"Dormitorio principal\", individual:\"Dormitorio individual\", doble:\"Do options: [{v:\"pb\",label:\"Todo en planta baja\"},{v:\"pbpa\",label:\"Planta baja y alta\"},{v:\"mas2\",label:\"Más de dos plantas\"},{v:\"orientacion\",label:\"Prefiero orientación del estudio\"}] },\n      { id: \"subsuelo\", type: \"seg\", label: \"Subsuelo\", help: \"Se puede sumar a cualquiera de las opciones anteriores.\",\n        options: [{v:\"no\",label:\"Sin subsuelo\"},{v:\"si\",label:\"Con subsuelo\"},{v:\"evaluar\",label:\"A evaluar\"}] },\n      { id: \"obligPB\", type: \"chips\", label: \"Debe quedar en planta baja\", when: (a) => a.plantas === \"pbpa\" || a.plantas === \"mas2\" || a.plantas === \"orientacion\",\n        options: [\"Dormitorio principal\",\"Un dormitorio\",\"Baño completo\",\"Estar\",\"Cocina\",\"Oficina\",\"Lavadero\",\"Ambiente flexible\"] },\n      { id: \"escalera\", type: \"seg\", label: \"Escalera\", when: (a) => a.plantas === \"pbpa\" || a.plantas === \"mas2\" || a.plantas === \"orientacion\" || a.subsuelo === \"si\",\n        options: [{v:\"conv\",label:\"Convencional\"},{v:\"prot\",label:\"Con diseño protagonista\"},{v:\"escu\",label:\"Escultórica\"}] },\n      { id: \"ascensor\", type: \"seg\", label: \"Ascensor\", when: (a) => a.plantas === \"pbpa\" || a.plantas === \"mas2\" || a.plantas === \"orientacion\" || a.subsuelo === \"si\",\n        options: [{v:\"si\",label:\"Desde el inicio\"},{v:\"prev\",label:\"Previsión futura\"},{v:\"no\",label:\"Sin ascensor\"}] }\n    ] },\n  { id: \"dormitorios\", title: \"Dormitorios y guardado\", intro: \"Cuántos dormitorios, de qué tipo, y cómo se resuelve el guardado en cada uno.\",\n    fields: [\n      { id: \"dorms\", type: \"counts\", label: \"Dormitorios\",\n        items: [ {id:\"principal\",label:\"Principal\",def:1,hint:\"12-20 m². Cama de dos plazas grande, paso a ambos lados, suele llevar baño en suite.\"},{id:\"individual\",label:\"Individual\",hint:\"8-13 m². Una cama de una plaza. El más chico de todos.\"},{id:\"doble\",label:\"Doble\",hint:\"10-16 m². Dos camas de una plaza o una de dos plazas, sin la holgura del principal.\"},{id:\"infantil\",label:\"Infantil compartido\",hint:\"11-18 m². Suma piso libre para jugar y zona de escritorio que cambia con la edad.\"},{id:\"huespedes\",label:\"Huéspedes\",hint:\"9-14 m². Cama de dos plazas, sin guardado permanente.\"},{id:\"servicio\",label:\"Servicio\"},{id:\"flexible\",label:\"Flexible\"} ] },\n      { id: \"vestidores\", type: \"counts\", label: \"Vestidor compartido\", help: \"El placard ya está contado dentro del dormitorio.\",\n        items: [ {id:\"compartido\",label:\"Vestidores compartidos\",hint:\"5-9 m². Vestidor privado (4-6 m²) usado por dos personas.\"} ] }\n    ] },\n  { id: \"banos\", title: \"Baños\", intro: \"Cuántos baños, cuáles son privados y qué lleva cada uno.\",\n    fields: [\n      { id: \"banos\", type: \"counts\", label: \"Cantidad\",\n        items: [ {id:\"completos\",label:\"Baños completos\",def:1},{id:\"toilettes\",label:\"Toilettes\"} ] }\n    ] },\n  { id: \"social\", title: \"Áreas sociales y cocina\", intro: \"Cómo se usa la casa un martes cualquiera y cómo se usa cuando hay visitas. Esa diferencia define buena parte del programa.\",\n    fields: [\n      { id: \"sociales\", type: \"chips\", label: \"Ambientes\",\n        help: \"Elegí los que quieras tener. La cocina va aparte: siempre está, y en el campo siguiente definimos de qué tipo.\",\n        options: [\"Living\",\"Comedor\",\"Comedor diario\",\"Sala familiar\",\"Bar\"] },\n      { id: \"cocina\", type: \"seg\", label: \"Cocina\",\n        help: \"Cuánto se abre al resto de la casa. Cambia la superficie y también cómo se vive el día a día.\",\n        options: [{v:\"integrada\",label:\"Integrada\"},{v:\"semi\",label:\"Semiintegrada\"},{v:\"indep\",label:\"Independiente\"}] },\n      { id: \"cocinaEquip\", type: \"chips\", label: \"Equipamiento de cocina\",\n        options: [\"Isla\",\"Península\",\"Barra\",\"Mesa diaria\",\"Cocina de apoyo\",\"Cava\"] },\n      { id: \"comensales\", type:
