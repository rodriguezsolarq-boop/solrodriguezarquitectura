; hi += 0.8; }\n    if (full && on(\"Bidé\")) { lo += 0.3; hi += 0.6; }\n    if (full && on(\"Inodoro separado\")) { lo += 1; hi += 1.6; }\n    if (full && on(\"Ducha amplia\")) { lo += 0.6; hi += 1.2; }\n    if (!full && on(\"Ducha de servicio\")) { lo += 1.2; hi += 1.8; }\n    if (on(\"Guardado\")) { lo += 0.4; hi += 0.8; }\n    if (on(\"Accesibilidad\")) { lo += 1.2; hi += 2; }\n    return [lo, hi];\n  }\n  lvl() { const v = this.state.a.amplitud; return typeof v === \"number\" ? v : 1; }\n  tri(k) {\n    const t = T[k]; if (!t) return [0, 0];\n    const L = this.lvl(), lo = t[L], next = t[Math.min(L + 1, 2)];\n    return [lo, Math.max(lo + (next - lo) * 0.55, lo * 1.1)];\n  }\n  // Reparte el programa entre etapas y pondera la inversión: un m² con instalaciones\n  // pesa el doble que un m² seco, y la obra en altura obliga a anticipar estructura.\n  planEtapas(rooms, cubLo, cubHi, semiEqLo, semiEqHi, vm, res, multi, a, semisNombres) {\n    const MOJ = /quincho/i;\n    semisNombres = semisNombres || [];\n    const n = a.cantEtapas && a.cantEtapas >= 2 ? Math.min(a.cantEtapas, 4) : 2;\n    const pri = a.primeraEtapa || [];\n    const REGLAS = {\n      \"Acceso\": /^acceso|hall|recibidor/i,\n      \"Cocina\": /cocina|despensa/i,\n      \"Estar-comedor\": /estar|living|comedor|sala familiar/i,\n      \"Dormitorio principal\": /dormitorio principal|vestidor privado/i,\n      \"Un dormitorio más\": /dormitorio (individual|doble|infantil)/i,\n      \"Baño completo\": /^ba[ñn]o completo/i,\n      \"Guardado\": /guardado|ropa blanca|despensa/i,\n      \"Lavado\": /lavadero|planchado|patio de servicio/i\n    };\n    const enPrimera = (name) => {\n      if (!pri.length) return /cocina|^ba[ñn]o completo|estar|living|comedor|dormitorio principal|vestidor privado|acceso|lavadero/i.test(name);\n      return pri.some(p => REGLAS[p] && REGLAS[p].test(name));\n    };\n    const usadoUno = {};\n    rooms.forEach(r => {\n      let et = 1;\n      if (!enPrimera(r.name)) et = 2;\n  { const [lo, hi] = this.tri(k); for (let i = 0; i < (n || 0); i++) rooms.push({ name, lo, hi, equip: equip || \"\" }); };\n\n    DORM_KEYS.forEach(k => {\n      const [dLo, dHi] = this.tri(k);\n      for (let i = 1; i <= this.cnt(\"dorms\", k); i++) {\n        const fid = \"dormEq_\" + k + i, on = (v) => this.has(fid, v);\n        let lo = dLo, hi = dHi;\n        if (on(\"Escritorio\")) { lo += 1; hi += 1.6; }\n        if (on(\"Cuna\")) { lo += 0.8; hi += 1.2; }\n        if (on(\"Sillón\")) { lo += 1; hi += 1.5; }\n        if (on(\"Cama king\")) { lo += 1.5; hi += 2.5; }\n        const gd = a[\"dormGd_\" + k + i];\n        if (gd === \"amplio\") { lo += 0.8; hi += 1.4; }\n        if (gd === \"sin\") { lo -= 0.8; hi -= 1.2; }\n        const gdLabel = {placard:\"Placard\",amplio:\"Placard amplio\",vestidor:\"Vestidor privado\",sin:\"Sin guardado incorporado\"}[gd] || \"\";\n        const eqList = (this.state.a[fid] || []).slice();\n        rooms.push({ name: DORM_LABELS[k] + (this.cnt(\"dorms\", k) > 1 ? \" \" + i : \"\"), lo: Math.max(6, lo), hi: Math.max(7, hi), equip: eqList.concat(gdLabel && gd !== \"vestidor\" ? [gdLabel] : []).join(\", \") });\n        if (gd === \"vestidor\") { const v = this.tri(\"privado\"); rooms.push({ name: \"Vestidor privado\", lo: v[0], hi: v[1], equip: \"Del \" + DORM_LABELS[k].toLowerCase() }); }\n      }\n    });\n    add(\"Vestidor compartido\", \"compartido\", this.cnt(\"vestidores\", \"compartido\"));\n    const [bcLo, bcHi] = this.tri(\"completos\");\n    for (let i = 1; i <= this.cnt(\"banos\", \"completos\"); i++) {\n      const ex = this.banoExtra(\"banoEq_c\" + i, true);\n      rooms.push({ name: \"Baño completo\" + (this.cnt(\"banos\", \"completos\") > 1 ? \" \" + i : \"\"), lo: bcLo + ex[0], hi: bcHi + ex[1], equip: (a[\"banoEq_c\" + i] || []).join(\", \") });\n    }\n    const [btLo, btHi] = this.tri(\"toilettes\");\n    for (let j = 1; j <= this.cnt(\"banos\", \"toilettes\"); j++) {\n      const ex = this.banoExtra(\"bano
