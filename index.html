138,59,34,.35)}\n  a:hover{color:#5E2413;border-bottom-color:#5E2413}\n  input,button,textarea{font-family:inherit}\n  input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid #8A3B22;outline-offset:2px}\n  ::placeholder{color:#A9A296}\n  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n  @media print{\n    @page{size:A4;margin:14mm}\n    [data-om-noprint]{display:none!important}\n    body{background:#fff}\n    tr,li,h2,[data-inf-note]{break-inside:avoid}\n    h2{break-after:avoid}\n  }\n  @media (max-width:1240px){\n    [data-g=\"main\"]{grid-template-columns:minmax(0,1fr)!important;gap:40px!important}\n    [data-g=\"aside\"]{position:static!important;flex-direction:row!important;flex-wrap:wrap!important;align-items:stretch!important}\n    [data-g=\"aside\"]>div{flex:1 1 300px}\n    [data-g=\"aside\"]>p{flex:1 1 100%}\n  }\n  @media (max-width:1080px){\n    [data-g=\"shell\"]{grid-template-columns:minmax(0,1fr)!important}\n    [data-g=\"rail\"]{position:sticky!important;top:0!important;z-index:6;height:auto!important;overflow:visible!important;padding:14px 18px!important;gap:12px!important}\n    [data-g=\"railhead\"]{flex-direction:row!important;align-items:baseline!important;gap:10px!important;flex-wrap:wrap!important}\n    [data-g=\"railhead\"]>span:nth-child(2){font-size:15px!important}\n    [data-g=\"railhead\"]>span:nth-child(3){font-size:11px!important}\n    [data-g=\"nav\"]{flex-direction:row!important;flex-wrap:nowrap!important;gap:6px!important;overflow-x:auto!important;padding-bottom:2px!important;-webkit-overflow-scrolling:touch;scrollbar-width:none}\n    [data-g=\"nav\"]::-webkit-scrollbar{display:none}\n    [data-g=\"nav\"]>button{flex:none!important;border-left:0!important;border-bottom:3px solid transparent!important;padding:9px 12px!important;white-space:nowrap!important;min-height:40px!important}\n    [data-g=\"railfoot\"]{margin-top:0!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;gap:12px!important;flex-wrap:wrap!important;padding-top:12px!important}\n    [data-g=\"railfoot\"]>span{display:none!important}\n    [data-g=\"railfoot\"]>button{padding:8px 12px!important;font-size:11px!important}\n    [data-g=\"content\"]{padding:40px 28px 96px!important}\n    [data-g=\"stats\"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}\n  }\n  @media (max-width:720px){\n    [data-g=\"pad\"]{padding-left:20px!important;padding-right:20px!important;padding-top:28px!important;padding-bottom:28px!important}\n    [data-g=\"costo\"]{font-size:28px!important;letter-spacing:-.02em!important;overflow-wrap:anywhere}\n    [data-g=\"inf\"]{padding:36px 20px!important}\n    [data-g=\"inf\"] h1{font-size:30px!important}\n    [data-g=\"inf\"] h2{font-size:19px!important}\n    [data-g=\"inf\"] table{font-size:12.5px!important}\n    [data-g=\"inf\"] td,[data-g=\"inf\"] th{padding-top:6px!important;padding-bottom:6px!important}\n    [data-g=\"aviso\"]{padding:48px 20px!important}\n    [data-g=\"aviso\"] h1{font-size:34px!important}\n    [data-g=\"nav\"]>button[data-active=\"0\"]>span:last-child{display:none!important}\n    [data-g=\"content\"]{padding:32px 20px 80px!important}\n    [data-g=\"intro\"],[data-g=\"result\"]{padding-left:20px!important;padding-right:20px!important}\n    [data-g=\"step-title\"]{font-size:34px!important}\n    [data-g=\"result\"] h1{font-size:40px!important}\n    [data-g=\"stats\"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}\n    [data-g=\"infhead\"]{gap:4px!important}\n    [data-g=\"infhead\"]>span{letter-spacing:.12em!important;font-size:11px!important}\n    [data-g=\"etapas\"] thead{display:none}\n    [data-g=\"etapas\"] tbody tr{display:block;border-bottom:1px solid #E1DACE;padding:12px 0}\n    [data-g=\"etapas\"] td{display:block;width:auto!important;text-align:left!important;white-space:normal!important;border-bottom:0!important;padding:2px 0!important}\n    [data-g=\"etapas\"] td:nth-child(2),[data-g=\"etapas\"] td:nth-child(3){display:inline-block;margin-right:18px}\n    [data-g=\"head\"]{display:block!important}\n    [data-g=\"head\"]>span{display:block}\n    [data-g=\"head\"]>span+span{margin-top:6px}\n    [data-g=\"duo\"]>div{padding:24px 0!important;border-right:0!important;border-bottom:1px solid #D5CEC2}\n    [data-g=\"duo\"]>div:last-child{border-bottom:0}\n    [data-g=\"idx\"]{gap:0!important}\n    [data-g=\"mock\"]{height:300px!important;margin-top:44px!important}\n    [data-g=\"mockwrap\"]{transform:scale(.55);transform-origin:top center}\n    [data-g=\"intro\"] h1{font-size:40px!important}\n  }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#EFEBE3;color:#15171A\">\n\n<sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-g=\"intro\" style=\"max-width:1180px;margin:0 auto;padding:72px 40px 96px\">\n  <div data-g=\"head\" style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #15171A;padding-bottom:18px;gap:16px;flex-wrap:wrap\">\n    <span style=\"font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase\">{{ marca }}<\u002Fspan>\n    <span style=\"font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#6B6660\">Asesoría preliminar · {{ fechaValor }}<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin:56px 0 18px;font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8A3B22\">Guía gratuita<\u002Fp>\n  <h1 style=\"margin:0;font-size:76px;line-height:.95;font-weight:900;letter-spacing:-.035em;max-width:18ch;text-wrap:balance\">Guía gratuita para calcular los m2 de tu hogar<\u002Fh1>\n  <p style=\"margin:32px 0 0;max-width:58ch;font-size:21px;line-height:1.5;color:#3A3A38\">Respondé sobre la casa que tenés en mente y recibís un informe con tu programa completo, la superficie que implica y una referencia de obra. Sin costo y sin compromiso.<\u002Fp>\n\n  <div data-g=\"duo\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:0;margin:56px 0 0;border-top:1px solid #D5CEC2\">\n    <div style=\"padding:28px 32px 28px 0;border-right:1px solid #D5CEC2\">\n      <p style=\"margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">Cuánto lleva<\u002Fp>\n      <p style=\"margin:0;font-size:16px;line-height:1.55;color:#3A3A38\">Entre diez y quince minutos. Se guarda en tu dispositivo, así que podés dejarlo por la mitad y seguir después.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:28px 0 28px 32px\">\n      <p style=\"margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">Con qué criterio<\u002Fp>\n      <p style=\"margin:0;font-size:16px;line-height:1.55;color:#3A3A38\">Referencias dimensionales y ergonómicas reconocidas, como Neufert, y los criterios preliminares del estudio. Es una orientación seria, no un proyecto.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  \n\n  <p style=\"margin:72px 0 6px;font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase\">Qué trae el informe<\u002Fp>\n  <p style=\"margin:0 0 28px;max-width:60ch;font-size:16px;line-height:1.55;color:#4A4A46\">Un documento armado con tus respuestas, no una plantilla. Estas son sus secciones.<\u002Fp>\n  <div data-g=\"idx\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:0 48px;border-top:1px solid #D5CEC2\">\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #E1DACE\">\n        <span style=\"font-size:12px;font-weight:800;color:#8A3B22;min-width:22px;padding-top:3px\">01<\u002Fspan>\n        <div>\n          <div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Programa y superficies<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:#6B6660;margin-top:3px\">Ambiente por ambiente, con su equipamiento y su superficie estimada.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #E1DACE\">\n        <span style=\"font-size:12px;font-weight:800;color:#8A3B22;min-width:22px;padding-top:3px\">02<\u002Fspan>\n        <div>\n          <div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">De superficie útil a superficie cubierta<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:#6B6660;margin-top:3px\">Circulaciones, muros, escalera y espacios técnicos, con los supuestos a la vista.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #E1DACE\">\n        <span style=\"font-size:12px;font-weight:800;color:#8A3B22;min-width:22px;padding-top:3px\">03<\u002Fspan>\n        <div>\n          <div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Exteriores y semicubiertos<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:#6B6660;margin-top:3px\">Galería, quincho y cochera, computados con su factor.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #E1DACE\">\n        <span style=\"font-size:12px;font-weight:800;color:#8A3B22;min-width:22px;padding-top:3px\">04<\u002Fspan>\n        <div>\n          <div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Referencia preliminar de obra<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:#6B6660;margin-top:3px\">Un rango calculado sobre el índice CAUBA y en qué rubros se concentraría la inversión.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #E1DACE\">\n        <span style=\"font-size:12px;font-weight:800;color:#8A3B22;min-width:22px;padding-top:3px\">05<\u002Fspan>\n        <div>\n          <div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Cómo se reparte entre etapas<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:#6B6660;margin-top:3px\">Si construís por partes: superficie e inversión de cada etapa, y qué hay que prever al principio.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #E1DACE\">\n        <span style=\"font-size:12px;font-weight:800;color:#8A3B22;min-width:22px;padding-top:3px\">06<\u002Fspan>\n        <div>\n          <div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Lectura de tu programa<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:#6B6660;margin-top:3px\">Nuestras observaciones sobre lo que elegiste, con el porqué de cada una.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #E1DACE\">\n        <span style=\"font-size:12px;font-weight:800;color:#8A3B22;min-width:22px;padding-top:3px\">07<\u002Fspan>\n        <div>\n          <div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Qué falta definir<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:#6B6660;margin-top:3px\">Las decisiones que dependen del terreno, la orientación y la normativa.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #E1DACE\">\n        <span style=\"font-size:12px;font-weight:800;color:#8A3B22;min-width:22px;padding-top:3px\">08<\u002Fspan>\n        <div>\n          <div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Qué servicios ofrecemos para ayudarte<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:#6B6660;margin-top:3px\">Los tres niveles del método Full House y nuestra manera de trabajar.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:64px 0 10px;font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase\">Empecemos: ¿cómo te imaginás la obra?<\u002Fh2>\n  <p style=\"margin:0 0 24px;max-width:56ch;font-size:16px;line-height:1.55;color:#4A4A46\">Elegí una opción y arranca el cuestionario.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:20px\">\n    <button sc-camel-on-click=\"{{ startA }}\" style=\"text-align:left;cursor:pointer;background:#F7F4EE;border:2px solid #15171A;padding:34px 32px 30px;display:flex;flex-direction:column;gap:12px;transition:transform .16s ease,box-shadow .16s ease\" style-hover=\"transform:translateY(-3px);box-shadow:10px 10px 0 #15171A\">\n      <span style=\"font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">En una sola obra<\u002Fspan>\n      <span style=\"font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.05\">Vivienda completa<\u002Fspan>\n      <span style=\"font-size:15px;line-height:1.55;color:#4A4A46\">Proyectamos y construimos la casa entera de una vez.<\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ startB }}\" style=\"text-align:left;cursor:pointer;background:#F7F4EE;border:2px solid #15171A;padding:34px 32px 30px;display:flex;flex-direction:column;gap:12px;transition:transform .16s ease,box-shadow .16s ease\" style-hover=\"transform:translateY(-3px);box-shadow:10px 10px 0 #15171A\">\n      <span style=\"font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">Por etapas<\u002Fspan>\n      <span style=\"font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.05\">Obra por etapas<\u002Fspan>\n      <span style=\"font-size:15px;line-height:1.55;color:#4A4A46\">Proyectamos la casa completa y definimos en qué orden se construye.<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n\n  <p style=\"margin: 56px 0 0; max-width: 74ch; font-size: 14px; line-height: 1.65; color: #6B6660; border-top: 1px solid #D5CEC2; padding-top: 0px; text-align: center; width: 100%; margin-left: auto; margin-right: auto\">Mientras respondés van a aparecer comentarios nuestros sobre lo que elegís. Son criterios preliminares del estudio: sirven para pensar mejor, y las decisiones de fondo las conversamos juntos durante el proyecto.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAviso }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-g=\"aviso\" style=\"max-width:820px;margin:0 auto;padding:96px 40px\">\n  <p style=\"margin:0 0 14px;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8A3B22\">Obra por etapas<\u002Fp>\n  <h1 style=\"margin:0;font-size:52px;line-height:1.04;font-weight:900;letter-spacing:-.032em;max-width:24ch\">Empecemos por la casa terminada<\u002Fh1>\n  <p style=\"margin:26px 0 0;font-size:19px;line-height:1.55;color:#3A3A38;max-width:60ch\">Las preguntas que vienen son sobre la casa completa, con todos los ambientes, como la querés al final. Por ahora no pienses en qué se construye primero.<\u002Fp>\n  <p style=\"margin:20px 0 0;font-size:17px;line-height:1.6;color:#4A4A46;max-width:60ch\">Al final te preguntamos qué necesitás para poder mudarte y qué puede esperar un poco más. El orden de las etapas y sus previsiones técnicas los armamos nosotros: justamente por proyectar la casa completa desde el inicio se la puede construir por partes sin rehacer nada.<\u002Fp>\n  <div style=\"display:flex;gap:12px;align-items:center;margin-top:48px;border-top:2px solid #15171A;padding-top:26px\">\n    <button sc-camel-on-click=\"{{ continuarB }}\" style=\"cursor:pointer;background:#15171A;border:2px solid #15171A;color:#F7F4EE;padding:16px 34px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Comenzar<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ volverIntro }}\" style=\"cursor:pointer;background:transparent;border:2px solid #15171A;color:#15171A;padding:16px 26px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Volver<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-g=\"shell\" style=\"display:grid;grid-template-columns:288px minmax(0,1fr);align-items:start;min-height:100vh\">\n\n  <aside data-g=\"rail\" style=\"position:sticky;top:0;height:100vh;background:#15171A;color:#EFEBE3;padding:36px 28px;display:flex;flex-direction:column;gap:28px;overflow:auto\">\n    <div data-g=\"railhead\" style=\"display:flex;flex-direction:column;gap:6px\">\n      <span style=\"font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#C4B7A6\">{{ marca }}<\u002Fspan>\n      <span style=\"font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2\">Programador preliminar<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378\">{{ modalidadLabel }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"height:4px;background:#33342F\">\n        <div style=\"height:4px;background:#C86B45;width:{{ progressPct }}%;transition:width .3s ease\"><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A8378\">Paso {{ stepNum }} de {{ stepTotal }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <nav data-g=\"nav\" style=\"display:flex;flex-direction:column;gap:2px\">\n      <sc-for list=\"{{ nav }}\" as=\"s\" hint-placeholder-count=\"9\">\n        <button sc-camel-on-click=\"{{ s.go }}\" data-active=\"{{ s.active }}\" style=\"text-align:left;cursor:pointer;background:{{ s.bg }};border:0;border-left:3px solid {{ s.mark }};padding:11px 14px;display:flex;gap:12px;align-items:baseline;color:{{ s.fg }}\">\n          <span style=\"font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.65;min-width:18px\">{{ s.num }}<\u002Fspan>\n          <span style=\"font-size:14px;font-weight:{{ s.weight }};line-height:1.3\">{{ s.title }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <div data-g=\"railfoot\" style=\"margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid #33342F;padding-top:18px\">\n      <span style=\"font-size:12px;line-height:1.5;color:#8A8378\">Guardamos lo que respondés en este dispositivo, así podés volver y cambiarlo.<\u002Fspan>\n      <button sc-camel-on-click=\"{{ goIntro }}\" style=\"cursor:pointer;background:transparent;color:#C4B7A6;border:1px solid #46473F;padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase\">Volver al inicio<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main data-g=\"content\" style=\"padding:56px 48px 120px;max-width:1240px\">\n    <div data-g=\"main\" style=\"display:grid;grid-template-columns:minmax(min(420px,100%),1fr) 320px;gap:56px;align-items:start\">\n      <div>\n        <p style=\"margin:0 0 14px;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8A3B22\">Bloque {{ stepNum }}<\u002Fp>\n        <h2 data-g=\"step-title\" style=\"margin:0;font-size:52px;line-height:1.02;font-weight:900;letter-spacing:-.032em;max-width:18ch;text-wrap:balance\">{{ stepTitle }}<\u002Fh2>\n        <p style=\"margin:18px 0 0;max-width:58ch;font-size:17px;line-height:1.55;color:#4A4A46\">{{ stepIntro }}<\u002Fp>\n\n        <div style=\"display:flex;flex-direction:column;gap:44px;margin-top:52px\">\n          <sc-for list=\"{{ fields }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;flex-direction:column;gap:14px;border-top:1px solid #D5CEC2;padding-top:22px\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <h3 style=\"margin:0;font-size:20px;font-weight:800;letter-spacing:-.015em\">{{ f.label }}<\u002Fh3>\n                <sc-if value=\"{{ f.help }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"margin:0;max-width:62ch;font-size:14px;line-height:1.55;color:#6B6660\">{{ f.help }}<\u002Fp>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ f.isOpts }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n                  <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ o.click }}\" style=\"cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;padding:13px 18px;min-height:48px;justify-content:center;border:2px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }};transition:all .12s ease\">\n                      <span style=\"font-size:15px;font-weight:700;letter-spacing:-.01em\">{{ o.label }}<\u002Fspan>\n                      <sc-if value=\"{{ o.hint }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"font-size:12px;font-weight:500;opacity:.72\">{{ o.hint }}<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ f.isCounts }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(276px,100%),1fr));gap:8px\">\n                  <sc-for list=\"{{ f.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;background:{{ it.bg }};border:1px solid {{ it.bd }};padding:10px 10px 10px 16px\">\n                      <div style=\"display:flex;flex-direction:column;gap:2px\">\n                        <span style=\"font-size:15px;font-weight:600\">{{ it.label }}<\u002Fspan>\n                        <sc-if value=\"{{ it.hint }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span style=\"font-size:12px;color:#6B6660\">{{ it.hint }}<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;gap:2px\">\n                        <button sc-camel-on-click=\"{{ it.dec }}\" style=\"cursor:pointer;width:44px;height:44px;border:1px solid #D5CEC2;background:#FFFFFF;font-size:20px;font-weight:700;color:#15171A;line-height:1\">−<\u002Fbutton>\n                        <span style=\"min-width:38px;text-align:center;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums\">{{ it.n }}<\u002Fspan>\n                        <button sc-camel-on-click=\"{{ it.inc }}\" style=\"cursor:pointer;width:44px;height:44px;border:1px solid #15171A;background:#15171A;color:#F7F4EE;font-size:20px;font-weight:700;line-height:1\">+<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ f.isText }}\" hint-placeholder-val=\"{{ false }}\">\n                <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onText }}\" placeholder=\"{{ f.placeholder }}\" style=\"width:100%;max-width:520px;padding:15px 18px;font-size:17px;font-weight:600;border:2px solid #D5CEC2;background:#FFFFFF;color:#15171A\">\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ f.isArea }}\" hint-placeholder-val=\"{{ false }}\">\n                <textarea value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onText }}\" placeholder=\"{{ f.placeholder }}\" rows=\"3\" style=\"width:100%;max-width:640px;padding:15px 18px;font-size:16px;line-height:1.5;font-weight:400;border:2px solid #D5CEC2;background:#FFFFFF;color:#15171A;resize:vertical\"><\u002Ftextarea>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ tieneNota }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:40px;background:#E4DED2;border-left:4px solid #8A3B22;padding:22px 24px\">\n            <p style=\"margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8A3B22\">Lo resolvemos nosotros<\u002Fp>\n            <p style=\"margin:0;max-width:62ch;font-size:15px;line-height:1.55;color:#2C2E30\">{{ stepNota }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;gap:12px;align-items:center;margin-top:56px;border-top:2px solid #15171A;padding-top:24px\">\n          <button sc-camel-on-click=\"{{ prev }}\" style=\"cursor:pointer;background:transparent;border:2px solid #15171A;color:#15171A;padding:15px 26px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Anterior<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ next }}\" style=\"cursor:pointer;background:#15171A;border:2px solid #15171A;color:#F7F4EE;padding:15px 34px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">{{ nextLabel }}<\u002Fbutton>\n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <aside data-g=\"aside\" style=\"position:sticky;top:56px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"background:#15171A;color:#EFEBE3;padding:24px 22px\">\n          <p style=\"margin:0 0 14px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#C4B7A6\">Estimación en curso<\u002Fp>\n          <div style=\"font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums\">{{ cubRange }}<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A8378;margin-top:6px\">m² cubiertos estimados<\u002Fdiv>\n          <div style=\"display:flex;gap:22px;margin-top:20px;border-top:1px solid #33342F;padding-top:16px\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <span style=\"font-size:20px;font-weight:800;font-variant-numeric:tabular-nums\">{{ semiRange }}<\u002Fspan>\n              <span style=\"font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A8378\">m² semicub.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <span style=\"font-size:20px;font-weight:800;font-variant-numeric:tabular-nums\">{{ ambCount }}<\u002Fspan>\n              <span style=\"font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A8378\">Ambientes<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#F7F4EE;border:1px solid #D5CEC2;padding:22px\">\n          <p style=\"margin:0 0 14px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">Observaciones<\u002Fp>\n          <sc-if value=\"{{ hasNotes }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n              <sc-for list=\"{{ notes }}\" as=\"n\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;flex-direction:column;gap:5px;animation:rise .3s ease both\">\n                  <span style=\"font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A8378\">{{ n.tipo }}<\u002Fspan>\n                  <span style=\"font-size:14px;line-height:1.5;color:#2C2E30\">{{ n.texto }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noNotes }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:14px;line-height:1.5;color:#6B6660\">A medida que respondas vamos a ir comentando lo que tus elecciones tienen que ver entre sí.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <p style=\"margin:0;font-size:12px;line-height:1.5;color:#8A8378\">Son rangos preliminares: todavía no verifican normativa ni son un presupuesto.<\u002Fp>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDatos }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-g=\"result\" style=\"max-width:900px;margin:0 auto;padding:64px 40px 110px\">\n  <div data-g=\"head\" style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #15171A;padding-bottom:16px;gap:14px;flex-wrap:wrap\">\n    <span style=\"font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase\">{{ marca }}<\u002Fspan>\n    <button sc-camel-on-click=\"{{ volverForm }}\" style=\"cursor:pointer;background:transparent;border:0;color:#8A3B22;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:underline\">Volver y editar<\u002Fbutton>\n  <\u002Fdiv>\n  <p style=\"margin:46px 0 0;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8A3B22\">Último paso<\u002Fp>\n  <div data-g=\"pad\" style=\"margin-top:0;border:2px solid #15171A;background:#F7F4EE;padding:44px 40px\">\n    <h2 style=\"margin:0;font-size:34px;font-weight:900;letter-spacing:-.028em;max-width:20ch\">Dejanos tus datos y te mandamos el informe<\u002Fh2>\n    <p style=\"margin:14px 0 0;max-width:62ch;font-size:16px;line-height:1.55;color:#4A4A46\">Ya tenemos tu programa. El informe es un documento de varias páginas, armado con tus respuestas: te lo enviamos y lo ves en pantalla enseguida.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:22px 40px;margin-top:26px;border-top:1px solid #D5CEC2;padding-top:22px\">\n      <div style=\"display:flex;flex-direction:column\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22;margin-bottom:12px\">Qué trae<\u002Fspan>\n        <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5;color:#3A3A38\">\n          <li>El programa completo, ambiente por ambiente, con su superficie estimada.<\u002Fli>\n          <li>La superficie cubierta y los exteriores, con los supuestos que usamos.<\u002Fli>\n          <li>La referencia de obra y dónde se concentraría la inversión.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22;margin-bottom:12px\">Y además<\u002Fspan>\n        <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5;color:#3A3A38\">\n          <li>Nuestras observaciones desarrolladas, con el porqué de cada una.<\u002Fli>\n          <li>Las etapas y sus previsiones, si elegís construir por partes.<\u002Fli>\n          <li>Lo que habrá que verificar con el terreno, la orientación y la normativa.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px;margin-top:34px\">\n      <label style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">Nombre <span style=\"color:#8A3B22\">·<\u002Fspan> obligatorio<\u002Fspan>\n        <input value=\"{{ cNombre }}\" sc-camel-on-change=\"{{ onNombre }}\" placeholder=\"Nombre y apellido\" style=\"padding:14px 16px;font-size:16px;font-weight:600;border:2px solid #D5CEC2;background:#FFFFFF;color:#15171A\">\n      <\u002Flabel>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">Medio de entrega<\u002Fspan>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <sc-for list=\"{{ medios }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ m.click }}\" style=\"cursor:pointer;padding:13px 20px;min-height:48px;font-size:15px;font-weight:700;border:2px solid {{ m.bd }};background:{{ m.bg }};color:{{ m.fg }}\">{{ m.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ pideCorreo }}\" hint-placeholder-val=\"{{ false }}\">\n        <label style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">Correo<\u002Fspan>\n          <input value=\"{{ cCorreo }}\" sc-camel-on-change=\"{{ onCorreo }}\" placeholder=\"nombre@correo.com\" style=\"padding:14px 16px;font-size:16px;font-weight:600;border:2px solid #D5CEC2;background:#FFFFFF;color:#15171A\">\n        <\u002Flabel>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ pideWa }}\" hint-placeholder-val=\"{{ false }}\">\n        <label style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">WhatsApp<\u002Fspan>\n          <input value=\"{{ cWa }}\" sc-camel-on-change=\"{{ onWa }}\" placeholder=\"+54 9 ...\" style=\"padding:14px 16px;font-size:16px;font-weight:600;border:2px solid #D5CEC2;background:#FFFFFF;color:#15171A\">\n        <\u002Flabel>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <button sc-camel-on-click=\"{{ toggleComercial }}\" style=\"cursor:pointer;display:flex;align-items:flex-start;gap:12px;background:transparent;border:0;padding:24px 0 0;text-align:left\">\n      <span style=\"width:24px;height:24px;flex:none;border:2px solid #15171A;background:{{ comercialBg }};color:#F7F4EE;font-size:15px;font-weight:900;line-height:20px;text-align:center\">{{ comercialMark }}<\u002Fspan>\n      <span style=\"font-size:15px;line-height:1.5;color:#3A3A38;max-width:60ch\">Me gustaría que me escriban para conversar sobre el proyecto. Es opcional: sólo lo hacemos si marcás esta casilla.<\u002Fspan>\n    <\u002Fbutton>\n\n    <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:28px\">\n      \n      <button sc-camel-on-click=\"{{ enviar }}\" style=\"cursor:pointer;background:#15171A;border:2px solid #15171A;color:#F7F4EE;padding:17px 38px;font-size:15px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Recibir el informe<\u002Fbutton>\n      <span style=\"font-size:14px;font-weight:600;color:{{ envioColor }}\">{{ envioMsg }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <p style=\"margin:28px 0 0;max-width:78ch;font-size:12px;line-height:1.65;color:#6B6660;border-top:1px solid #D5CEC2;padding-top:18px\">Usamos tus datos únicamente para armarte el informe y enviártelo por donde elegiste. No los vendemos, cedemos ni compartimos con nadie.<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isInforme }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#EFEBE3;padding:0 0 80px\">\n  <div data-om-noprint=\"1\" style=\"position:sticky;top:0;z-index:5;background:#15171A;color:#EFEBE3;padding:16px 32px;display:flex;gap:14px;align-items:center;flex-wrap:wrap\">\n    <span style=\"font-size:13px;font-weight:700;letter-spacing:.04em\">Tu informe está listo.<\u002Fspan>\n    <button sc-camel-on-click=\"{{ imprimir }}\" style=\"cursor:pointer;background:#C86B45;border:0;color:#15171A;padding:11px 22px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Descargar en PDF<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ volverResultado }}\" style=\"cursor:pointer;background:transparent;border:1px solid #46473F;color:#C4B7A6;padding:11px 18px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase\">Volver<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div data-g=\"inf\" style=\"max-width:860px;margin:0 auto;background:#FFFFFF;padding:64px 68px;color:#15171A\">\n    <div data-g=\"infhead\" style=\"border-bottom:3px solid #15171A;padding-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap\">\n      <span style=\"font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase\">{{ marca }}<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6660\">Informe preliminar · {{ infFecha }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <p style=\"margin:38px 0 10px;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">Programa preliminar de vivienda<\u002Fp>\n    <h1 style=\"margin:0;font-size:44px;line-height:1.02;font-weight:900;letter-spacing:-.03em;max-width:20ch\">Tu programa, en superficie y decisiones<\u002Fh1>\n    <p style=\"margin:18px 0 0;font-size:16px;line-height:1.55;color:#3A3A38;max-width:62ch\">{{ aperturaTexto }}<\u002Fp>\n\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;margin:32px 0 0;font-size:14px\">\n      <sc-raw-tbody>\n        <sc-for list=\"{{ infResumen }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;font-weight:600;color:#6B6660;width:34%\">{{ r.label }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;font-weight:700\">{{ r.valor }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h2 style=\"margin:46px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">1. Programa y superficies<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Cada ambiente se estima como rango, según su equipamiento y el nivel de amplitud elegido. El nivel que elegiste ya define el tamaño, así que el rango es acotado: alrededor de un 10% entre el mínimo y el máximo, lo que el proyecto puede mover al resolver la planta. Son medidas interiores libres: orientan el proyecto, no lo reemplazan.<\u002Fp>\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n      <sc-raw-thead>\n        <sc-raw-tr>\n          <sc-raw-th style=\"text-align:left;padding:8px 0;border-bottom:2px solid #15171A;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">Ambiente<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:left;padding:8px 0;border-bottom:2px solid #15171A;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">Según lo que indicaste<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:right;padding:8px 0;border-bottom:2px solid #15171A;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap\">m²<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ infRooms }}\" as=\"r\" hint-placeholder-count=\"8\">\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700\">{{ r.name }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">{{ r.equip }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ r.m2 }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n        <sc-raw-tr>\n          <sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;font-weight:900\">Superficie útil<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A\"><\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;text-align:right;font-weight:900;white-space:nowrap\">{{ infUtil }}<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">2. De superficie útil a superficie cubierta<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">A los ambientes se suma lo que la casa necesita para funcionar y sostenerse. Estos son los supuestos aplicados en tu caso.<\u002Fp>\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700;width:40%\">Circulaciones<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">{{ infCircPct }} de la superficie útil<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ infCirc }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700\">Muros<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">{{ infMurPct }}, según envolvente y sistema constructivo<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ infMuros }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700\">Escalera<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">Según la circulación vertical indicada<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ infEsc }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700\">Ascensor<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">Sólo si se instala desde el inicio<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ infAsc }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700\">Espacios técnicos<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">Tableros, tanques y equipos según los sistemas elegidos<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ infTec }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;font-weight:900\">Superficie cubierta estimada<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A\"><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;text-align:right;font-weight:900;white-space:nowrap\">{{ infCub }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <sc-if value=\"{{ haySemis }}\" hint-placeholder-val=\"{{ true }}\">\n      <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ nSemis }}. Exteriores y semicubiertos<\u002Fh2>\n      <p style=\"margin:0 0 18px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Un semicubierto no cuesta lo mismo que un ambiente cerrado ni lo mismo que un piso de patio. Se computa con un factor según cuánto se acerque a un ambiente terminado.<\u002Fp>\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n        <sc-raw-tbody>\n          <sc-for list=\"{{ infSemis }}\" as=\"s\" hint-placeholder-count=\"2\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700;width:34%\">{{ s.name }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">{{ s.config }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ s.m2 }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;font-weight:900\">Total semicubierto<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;color:#4A4A46\">Equivale a {{ infSemiEq }} m² cubiertos a efectos de costo<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;text-align:right;font-weight:900;white-space:nowrap\">{{ infSemiTotal }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ mostrarCosto }}\" hint-placeholder-val=\"{{ true }}\">\n      <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ nCosto }}. Referencia preliminar de obra<\u002Fh2>\n      <div style=\"background:#15171A;color:#EFEBE3;padding:26px 28px;margin:16px 0 20px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#C4B7A6\">Rango total preliminar<\u002Fdiv>\n        <div data-g=\"costo\" style=\"font-size:36px;font-weight:900;letter-spacing:-.035em;line-height:1.05;margin-top:6px\">{{ costoRange }}<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.55;color:#A9A296;margin-top:12px;max-width:70ch\">Calculado sobre el índice CAUBA que publica el Colegio de Arquitectos de la Provincia de Buenos Aires, para la región Pampeana, vivienda individual, a {{ fechaValor }}. El dato es público: <a href=\"https://www.capbacs.com/indicadores-cauba\" target=\"_blank\" rel=\"noopener\" style=\"color:#E4DED2;text-decoration:underline\">capbacs.com/indicadores-cauba<\u002Fa>. No incluye terreno, honorarios ni conceptos no definidos expresamente.{{ notaPileta }}<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 16px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Dónde se concentraría la inversión, según tus decisiones. Los porcentajes parten de una distribución de referencia y se ajustan por cantidad de baños, plantas, nivel de terminación e instalaciones.<\u002Fp>\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n        <sc-raw-tbody>\n          <sc-for list=\"{{ incidencias }}\" as=\"i\" hint-placeholder-count=\"6\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700;width:70%\">{{ i.grupo }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:800\">{{ i.pct }}%<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <sc-if value=\"{{ hayReserva }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:14px 0 0;font-size:13px;line-height:1.55;color:#6B6660;max-width:70ch\">Incluye una reserva de {{ infReserva }} por construir en etapas: cada arranque y cierre de obra tiene costos propios que no existen en una obra continua.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hayEtapas }}\" hint-placeholder-val=\"{{ false }}\">\n      <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ nEtapas }}. Cómo se reparte entre etapas<\u002Fh2>\n      <p style=\"margin:0 0 8px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">{{ etapasNota }}<\u002Fp>\n      <p style=\"margin:0 0 18px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">{{ etapasNotaAnticipo }}<\u002Fp>\n      <sc-raw-table data-g=\"etapas\" style=\"width:100%;border-collapse:collapse;font-size:14px\">\n        <sc-raw-thead>\n          <sc-raw-tr>\n            <sc-raw-th style=\"text-align:left;padding:8px 0;border-bottom:2px solid #15171A;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">Etapa<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:right;padding:8px 0;border-bottom:2px solid #15171A;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap\">Superficie<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:right;padding:8px 0;border-bottom:2px solid #15171A;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap\">Inversión<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ etapasFilas }}\" as=\"e\" hint-placeholder-count=\"2\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;vertical-align:top\">\n                <div style=\"font-weight:800\">{{ e.titulo }}<\u002Fdiv>\n                <div style=\"font-size:13px;line-height:1.45;color:#4A4A46;margin-top:2px\">{{ e.ambientes }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#8A3B22;font-weight:700;margin-top:3px\">{{ e.nota }}<\u002Fdiv>\n              <\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap;vertical-align:top\">{{ e.m2 }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;text-align:right;vertical-align:top;white-space:nowrap\">\n                <div style=\"font-weight:900\">{{ e.pct }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#6B6660;margin-top:2px\">{{ e.monto }}<\u002Fdiv>\n              <\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <p style=\"margin:14px 0 0;font-size:13px;line-height:1.55;color:#6B6660;max-width:70ch\">Los semicubiertos figuran en la etapa que los recibe, computados con su factor, igual que en el total. El reparto es una lectura preliminar del programa que cargaste, no un plan de obra. La secuencia definitiva se define en el anteproyecto, junto con el terreno y la normativa.<\u002Fp>\n    <\u002Fsc-if>\n\n    <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ nLectura }}. Lectura de tu programa<\u002Fh2>\n    <p style=\"margin:0 0 20px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Cada observación surge de una combinación concreta de tus respuestas. No indican una solución: señalan qué conviene definir y por qué.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <sc-for list=\"{{ topNotes }}\" as=\"n\" hint-placeholder-count=\"4\">\n        <div style=\"border-left:3px solid #8A3B22;padding-left:16px\">\n          <div style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22;margin-bottom:4px\">{{ n.tipo }}<\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#2C2E30\">{{ n.texto }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ nFalta }}. Qué falta definir<\u002Fh2>\n    <p style=\"margin:0 0 14px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Estas decisiones no pueden resolverse sin conocer el terreno. Van listadas para que lleguen ordenadas a la primera conversación.<\u002Fp>\n    <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.55;color:#3A3A38;max-width:70ch\">\n      <li>Orientación del lote y ubicación de los espacios de día respecto del sol.<\u002Fli>\n      <li>Retiros, altura máxima y factor de ocupación según la normativa local.<\u002Fli>\n      <li>Sistema constructivo y su efecto sobre plazos, espesores y terminaciones.<\u002Fli>\n      <li>Estudio de suelo, que define fundaciones y una parte importante de la obra gruesa.<\u002Fli>\n      <li>Nivel de terminación esperado, que mueve el rubro de mayor variación del costo.<\u002Fli>\n    <\u002Ful>\n\n    <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ nSigue }}. Cómo seguimos<\u002Fh2>\n    <p style=\"margin:0 0 16px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Trabajamos en tres niveles. Cada uno se apoya en las decisiones del anterior, y al terminar cada uno decidís si seguís.<\u002Fp>\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;font-weight:800;width:24%;vertical-align:top\">Nivel 1<br><span style=\"font-weight:600;color:#6B6660;font-size:13px\">Anteproyecto<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;color:#3A3A38;line-height:1.5\">Concepto, implantación, funcionamiento, imagen y la superficie real de la casa. Plantas, cortes y vistas, renders ilustrativos y lista de cantidades. 30 días hábiles.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;font-weight:800;vertical-align:top\">Nivel 2<br><span style=\"font-weight:600;color:#6B6660;font-size:13px\">Proyecto<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;color:#3A3A38;line-height:1.5\">Documentación en 1:50 con ejes y niveles, renders realistas, predimensionado de estructura, materialidad y planilla de aberturas. 40 días hábiles.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;font-weight:800;vertical-align:top\">Nivel 3<br><span style=\"font-weight:600;color:#6B6660;font-size:13px\">Legajo<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;color:#3A3A38;line-height:1.5\">La documentación ejecutiva con la que se construye: estructura, replanteos, instalaciones y lista de materiales. 20 días hábiles.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <div style=\"background:#F7F4EE;border-left:3px solid #8A3B22;padding:22px 24px;margin:30px 0 0\">\n      <p style=\"margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22\">Nuestra manera<\u002Fp>\n      <p style=\"margin:0;font-size:15px;line-height:1.5;font-weight:700;max-width:52ch\">La arquitectura no comienza dibujando una forma. Comienza comprendiendo un problema.<\u002Fp>\n      <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#3A3A38;max-width:70ch\">Por eso empezamos escuchando: este formulario es parte de ese trabajo. Y por eso el proceso tiene estructura, para que en cada paso sepas qué se está definiendo, cuándo nos volvemos a reunir y con qué tema. La belleza no la agregamos al final: aparece cuando el diseño nace del rigor técnico y la claridad conceptual.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin:34px 0 0;border-top:1px solid #D5CEC2;padding-top:20px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n      <span style=\"font-size:13px;font-weight:700\">{{ marca }}<\u002Fspan>\n      <span style=\"font-size:13px;color:#6B6660\">{{ email }}<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:14px 0 0;font-size:12px;line-height:1.6;color:#8A8378;max-width:78ch\">Este informe organiza necesidades y estima superficies a partir de referencias dimensionales y ergonómicas, incluyendo Neufert, y de criterios preliminares del estudio. No define la mejor distribución, no verifica normativa ni constituye un presupuesto definitivo.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-g=\"result\" style=\"max-width:1180px;margin:0 auto;padding:64px 40px 110px\">\n  <div data-g=\"head\" style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #15171A;padding-bottom:16px;gap:14px;flex-wrap:wrap\">\n    <span style=\"font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase\">{{ marca }}<\u002Fspan>\n    <button sc-camel-on-click=\"{{ backToForm }}\" style=\"cursor:pointer;background:transparent;border:0;color:#8A3B22;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:underline\">Volver y editar<\u002Fbutton>\n  <\u002Fdiv>\n\n  <p style=\"margin:52px 0 14px;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8A3B22\">Tu resultado<\u002Fp>\n  <h1 style=\"margin:0;max-width:22ch;font-size:64px;line-height:1;font-weight:900;letter-spacing:-.035em\">Tu programa preliminar<\u002Fh1>\n  <p style=\"margin:26px 0 0;max-width:64ch;font-size:19px;line-height:1.55;color:#3A3A38\">{{ aperturaTexto }}<\u002Fp>\n\n  <sc-if value=\"{{ haySintesis }}\" hint-placeholder-val=\"{{ true }}\">\n  <div data-g=\"stats\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#D5CEC2;border:1px solid #D5CEC2;margin-top:48px\">\n    <sc-for list=\"{{ sintesis }}\" as=\"s\" hint-placeholder-count=\"4\">\n      <div style=\"background:#F7F4EE;padding:26px 24px;display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:36px;font-weight:900;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums\">{{ s.valor }}<\u002Fspan>\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#6B6660\">{{ s.label }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:48px;margin-top:64px\">\n    <div>\n      <h2 style=\"margin:0 0 20px;font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid #D5CEC2;padding-bottom:12px\">Lo que vemos en tu programa<\u002Fh2>\n      <sc-if value=\"{{ noTopNotes }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0 0 22px;font-size:16px;line-height:1.55;color:#4A4A46\">Con lo que respondiste hasta ahora, el programa no presenta tensiones evidentes. Al completar más bloques del cuestionario aparecerán observaciones que relacionan sus decisiones.<\u002Fp>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <sc-for list=\"{{ topNotes }}\" as=\"n\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22\">{{ n.tipo }}<\u002Fspan>\n            <span style=\"font-size:16px;line-height:1.55;color:#2C2E30\">{{ n.texto }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h2 style=\"margin:0 0 20px;font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid #D5CEC2;padding-bottom:12px\">Dónde se iría la inversión<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ incidencias }}\" as=\"i\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n              <span style=\"font-size:14px;font-weight:600;color:#2C2E30\">{{ i.grupo }}<\u002Fspan>\n              <span style=\"font-size:14px;font-weight:800;font-variant-numeric:tabular-nums\">{{ i.pct }}%<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height:6px;background:#E1DACE\"><div style=\"height:6px;background:#8A3B22;width:{{ i.w }}%\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:16px 0 0;font-size:12px;line-height:1.55;color:#6B6660\">Son porcentajes estimados a partir de lo que elegiste, sobre una distribución de referencia. Se ajustan cuando definamos terreno, sistema constructivo y terminaciones.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ programaIncompleto }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:64px;background:#E4DED2;border-left:4px solid #8A3B22;padding:30px 32px\">\n      <p style=\"margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8A3B22\">Falta lo esencial<\u002Fp>\n      <p style=\"margin:0;max-width:64ch;font-size:16px;line-height:1.55;color:#2C2E30\">Como {{ faltaTexto }}, no tiene sentido estimar la obra: cualquier número que pongamos sería inventado. Volvé a ese bloque y completalo, y la estimación aparece sola.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ mostrarCosto }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-g=\"pad\" style=\"margin-top:64px;background:#15171A;color:#EFEBE3;padding:44px 40px\">\n      <p style=\"margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#C4B7A6\">Cuánto podría costar la obra<\u002Fp>\n      <div data-g=\"costo\" style=\"font-size:56px;font-weight:900;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums\">{{ costoRange }}<\u002Fdiv>\n      \n      <p style=\"margin:28px 0 0;max-width:78ch;font-size:13px;line-height:1.6;color:#A9A296\">Calculado sobre el índice CAUBA que publica el Colegio de Arquitectos de la Provincia de Buenos Aires, para la región Pampeana, vivienda individual, a {{ fechaValor }}. El dato es público y se puede consultar en <a href=\"https://www.capbacs.com/indicadores-cauba\" target=\"_blank\" rel=\"noopener\" style=\"color:#E4DED2;text-decoration:underline\">capbacs.com/indicadores-cauba<\u002Fa>. Es una referencia preliminar. Puede variar por ubicación, sistema constructivo, complejidad, calidad de terminaciones, condiciones del terreno, instalaciones y momento de ejecución. No incluye terreno ni conceptos que el estudio no haya definido expresamente.{{ notaPileta }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div data-g=\"pad\" style=\"margin-top:64px;border:2px solid #15171A;background:#F7F4EE;padding:36px 34px;display:flex;flex-direction:column;gap:16px;align-items:flex-start\">\n    <p style=\"margin:0;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8A3B22\">Tu informe<\u002Fp>\n    <h2 style=\"margin:0;font-size:30px;font-weight:900;letter-spacing:-.025em;max-width:24ch\">El documento completo ya está armado con tus respuestas<\u002Fh2>\n    <p style=\"margin:0;max-width:62ch;font-size:16px;line-height:1.55;color:#4A4A46\">Programa ambiente por ambiente, los supuestos de cada superficie, la referencia de obra y lo que conviene definir antes de proyectar.<\u002Fp>\n    <button sc-camel-on-click=\"{{ verInforme }}\" style=\"cursor:pointer;background:#15171A;border:2px solid #15171A;color:#F7F4EE;padding:16px 32px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Ver el informe<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:44px;align-items:start\">\n    <div>\n      <h2 style=\"margin:0 0 18px;font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid #D5CEC2;padding-bottom:12px\">Cómo trabajamos<\u002Fh2>\n      <p style=\"margin:0 0 24px;font-size:15px;line-height:1.55;color:#3A3A38\">El Método Full House se recorre en tres niveles. Cada uno se apoya en las decisiones del anterior, y vos decidís si avanzar con el proceso completo o nivel a nivel.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <div style=\"display:flex;gap:16px;align-items:baseline\">\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:.1em;color:#8A3B22;min-width:58px\">Nivel 1<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Anteproyecto<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.5;color:#4A4A46\">Definimos el concepto, la implantación, el funcionamiento, la imagen y la superficie real de la casa. Incluye plantas, cortes y vistas, renders ilustrativos y lista de cantidades. Es la columna vertebral de todo: 30 días hábiles.<\u002Fspan>\n            <a href=\"{{ waN1 }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;margin-top:6px;display:inline-block;background:transparent;color:#8A3B22;border:1px solid #C9BBA9;border-bottom:1px solid #C9BBA9;padding:9px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase\" style-hover=\"background:#8A3B22;color:#F7F4EE;border-color:#8A3B22\">Quiero consultar por el Nivel 1<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:baseline\">\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:.1em;color:#8A3B22;min-width:58px\">Nivel 2<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Proyecto<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.5;color:#4A4A46\">Documentación en 1:50 con ejes y niveles, renders realistas, predimensionado de estructura, definición de materialidad y planilla de aberturas. 40 días hábiles.<\u002Fspan>\n            <a href=\"{{ waN2 }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;margin-top:6px;display:inline-block;background:transparent;color:#8A3B22;border:1px solid #C9BBA9;border-bottom:1px solid #C9BBA9;padding:9px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase\" style-hover=\"background:#8A3B22;color:#F7F4EE;border-color:#8A3B22\">Quiero consultar por el Nivel 2<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:baseline\">\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:.1em;color:#8A3B22;min-width:58px\">Nivel 3<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Legajo<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.5;color:#4A4A46\">La documentación ejecutiva con la que se construye: estructura, replanteos, instalaciones y cantidades de materiales. 20 días hábiles.<\u002Fspan>\n            <a href=\"{{ waN3 }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;margin-top:6px;display:inline-block;background:transparent;color:#8A3B22;border:1px solid #C9BBA9;border-bottom:1px solid #C9BBA9;padding:9px 16px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase\" style-hover=\"background:#8A3B22;color:#F7F4EE;border-color:#8A3B22\">Quiero consultar por el Nivel 3<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-g=\"pad\" style=\"background:#E4DED2;padding:30px 28px\">\n      <h2 style=\"margin:0 0 12px;font-size:22px;font-weight:800;letter-spacing:-.02em\">Conversemos tu proyecto<\u002Fh2>\n      <p style=\"margin:0 0 20px;font-size:15px;line-height:1.55;color:#3A3A38\">Escribirnos no te compromete a nada. Las escalas de honorarios se conocen antes de contratar, y si decidís continuar, lo que abonaste por el Anteproyecto se acredita al servicio completo.<\u002Fp>\n      <a href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;background:#8A3B22;color:#F7F4EE;border:0;border-bottom:0;padding:16px 28px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Escribir por WhatsApp<\u002Fa>\n      <p style=\"margin:18px 0 0;font-size:14px;line-height:1.5;color:#4A4A46\">O por correo, a <a href=\"{{ mailLink }}\">{{ email }}<\u002Fa>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:44px;align-items:start;border-top:1px solid #D5CEC2;padding-top:28px\">\n    <div>\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22\">El servicio<\u002Fspan>\n      <p style=\"margin:10px 0 0;font-size:14px;line-height:1.55;color:#4A4A46\"><strong style=\"font-weight: 700;\">Full House<\u002Fstrong> es nuestro método completo. Además de la documentación necesaria para construir, suma curaduría y definición de detalle antes de que empiece la obra: despiece de pisos y revestimientos, planos de cielorrasos, planilla de terminaciones, detalles constructivos, desarrollo completo de instalaciones y los locales húmedos resueltos en escala 1:20.<\u002Fp>\n      <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#4A4A46\">La idea es simple: cada decisión que se toma en el proyecto es una decisión que no hay que improvisar en obra, con el albañil esperando y el costo ya corriendo. Incluye reunión preobra y dos asesorías durante la ejecución.<\u002Fp>\n      <a href=\"{{ waServicio }}\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:18px;display:inline-block;background:#15171A;color:#F7F4EE;border:0;border-bottom:0;padding:14px 24px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Si querés saber más, escribinos<\u002Fa>\n    <\u002Fdiv>\n    <div>\n      <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22\">Cómo se paga el Anteproyecto<\u002Fspan>\n      <p style=\"margin:10px 0 0;font-size:14px;line-height:1.55;color:#4A4A46\">El Anteproyecto arranca con un primer pago fijo, conocido de antemano según los m2 estimados que crees necesitar pero los honorarios finales se define recién cuando el propio Anteproyecto establece la superficie real de la casa, y las escalas están a la vista antes de contratar y de avanzar en la documentación, elección de materiales y artefactos, definición de detalles, etc.<\u002Fp>\n      <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#4A4A46\">Cuando avanzamos sobre el nivel 2 de Full House, todo lo que abonaste por el Anteproyecto se acredita al honorario total. <br><br>Entrar por el Nivel 1 te permite saber si realmente tus espectativas y objetivos están alineados con nuestra filosofía sin necesidad de comprometerte con todo el proceso desde el comienzo.&nbsp;<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin:28px 0 0;font-size:13px;line-height:1.6;color:#6B6660;max-width:84ch\">No incluye dirección de obra. El cálculo estructural definitivo corresponde a un ingeniero externo. No incluye estudio de suelos. Alcances, plazos y honorarios se detallan en la propuesta.<\u002Fp>\n\n\n  <div data-g=\"pad\" style=\"margin-top:56px;background:#15171A;color:#EFEBE3;padding:48px 44px\">\n    <p style=\"margin:0 0 10px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#C4B7A6\">Nuestra filosofía y nuestra manera<\u002Fp>\n    <h2 style=\"margin:0;max-width:24ch;font-size:34px;font-weight:900;letter-spacing:-.028em;line-height:1.1\">La arquitectura no comienza dibujando una forma. Comienza comprendiendo un problema.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:32px;margin-top:36px;border-top:1px solid #33342F;padding-top:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#C86B45\">La belleza<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#C4B7A6\">No entendemos la belleza como un recurso estético agregado al final del proceso. Creemos que la belleza es inevitable cuando el diseño nace del rigor técnico, el análisis funcional y la claridad conceptual.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#C86B45\">El lujo<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#C4B7A6\">No asociamos el valor con el exceso ni con el presupuesto. La calidad de una casa está en la inteligencia de sus decisiones. Diseñamos para invertir donde realmente importa.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#C86B45\">Nuestro compromiso<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#C4B7A6\">Diseñamos viviendas honestas, precisas y atemporales. Creemos que la mejor arquitectura no busca llamar la atención: permanece porque todo en ella tiene sentido.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:32px;margin-top:32px;border-top:1px solid #33342F;padding-top:28px\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#C86B45\">Escucharte primero<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#C4B7A6\">Antes de proyectar hay un trabajo de comprensión. Formularios específicos, como este, nos permiten entender cómo viven, qué buscan y qué imaginan quienes van a habitar la casa. Diseñamos a partir de eso, no de un supuesto nuestro.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#C86B45\">Saber siempre dónde estás<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#C4B7A6\">La estructura del método existe para eso: en qué etapa estamos, qué se está definiendo ahora, cuándo nos volvemos a reunir, con qué tema y para decidir qué. Cada reunión tiene su agenda y queda registrada.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#C86B45\">Un camino sin incertidumbre<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#C4B7A6\">Construir una casa no debería dejarte dudando si vas por el buen camino, si te estamos escuchando o si vamos a llegar a lo que buscás. Nuestro trabajo es que en cada paso sepas qué se decidió, qué queda pendiente y hacia dónde vamos.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin:56px 0 0;font-size:12px;line-height:1.65;color:#8A8378;border-top:1px solid #D5CEC2;padding-top:20px;max-width:84ch\">Esta estimación no define la mejor distribución, no verifica normativa ni es un presupuesto. Todo eso lo desarrollamos juntos durante el proyecto.<\u002Fp>\n<\u002Fdiv>\n\n\n\n\n<\u002Fsc-if><\u002Fdiv><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;marca&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sol Rodríguez Arquitectura&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5493329557152&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;rodriguezsol.arq@gmail.com&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;endpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://formspree.io/f/mqpkpljo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;valorM2&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1969122,&quot;min&quot;:100000,&quot;max&quot;:9000000,&quot;step&quot;:1000,&quot;unit&quot;:&quot;/m²&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Valores administrables&quot;},&quot;moneda&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ARS&quot;,&quot;USD&quot;],&quot;default&quot;:&quot;ARS&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Valores administrables&quot;},&quot;fechaValor&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Agosto de 2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Valores administrables&quot;},&quot;fuenteValor&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Índice CAUBA, Colegio de Arquitectos de la Provincia de Buenos Aires, región Pampeana, vivienda individual&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Valores administrables&quot;},&quot;mostrarCosto&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Valores administrables&quot;}}\">\nconst LEVELS = [\"ajustado\", \"confortable\", \"óptimo\"];\nconst DORM_KEYS = [\"principal\",\"individual\",\"doble\",\"infantil\",\"huespedes\",\"servicio\",\"flexible\"];\nconst DORM_LABELS = { principal:\"Dormitorio principal\", individual:\"Dormitorio individual\", doble:\"Dormitorio doble\", infantil:\"Dormitorio infantil\", huespedes:\"Dormitorio de huéspedes\", servicio:\"Dormitorio de servicio\", flexible:\"Ambiente flexible\" };\n\nconst SECTIONS = [\n  { id: \"generales\", title: \"Datos generales\", intro: \"Contános quiénes van a vivir en la casa y qué es lo que más pesa a la hora de decidir.\",\n    fields: [\n      { id: \"habitantes\", type: \"counts\", label: \"Personas\", help: \"Quienes viven todos los días, y también quienes aparecen seguido.\",\n        items: [ {id:\"habituales\",label:\"Habitantes habituales\",def:2}, {id:\"huespedes\",label:\"Huéspedes frecuentes\"}, {id:\"temporales\",label:\"Familiares temporales\"}, {id:\"servicio\",label:\"Personal de servicio\"} ] },\n      { id: \"prioridades\", type: \"chips\", label: \"Prioridades\", help: \"Marcá las que de verdad ordenan tus decisiones, no todas las que suenan bien.\",\n        options: [\"Eficiencia\",\"Amplitud\",\"Reuniones\",\"Trabajo\",\"Guardado\",\"Exterior\",\"Accesibilidad\",\"Privacidad\",\"Flexibilidad\"] },\n      { id: \"preferencia\", type: \"seg\", label: \"Preferencia general\",\n        options: [{v:\"compacta\",label:\"Compacta\"},{v:\"equilibrada\",label:\"Equilibrada\"},{v:\"amplia\",label:\"Amplia\"},{v:\"orientacion\",label:\"Prefiero orientación del estudio\"}] },\n      { id: \"amplitud\", type: \"seg\", label: \"Nivel de amplitud\", help: \"Vale para toda la casa. Incluso el nivel óptimo se mantiene en una escala doméstica, no monumental.\",\n        options: [{v:0,label:\"Ajustado\",hint:\"Mínimo funcional, prioriza eficiencia\"},{v:1,label:\"Confortable\",hint:\"Buena circulación, mobiliario y guardado\"},{v:2,label:\"Óptimo\",hint:\"Mayor amplitud y flexibilidad\"}] }\n    ] },\n  { id: \"plantas\", title: \"Plantas y circulación vertical\", intro: \"Veamos cómo se organiza la casa en altura y qué no debería faltar en la planta de acceso.\",\n
