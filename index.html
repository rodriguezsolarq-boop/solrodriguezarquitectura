document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lid #E1DACE;padding:12px 0}\n    [data-g=\"etapas\"] td{display:block;width:auto!important;text-align:left!important;white-space:normal!important;border-bottom:0!important;padding:2px 0!important}\n    [data-g=\"etapas\"] td:nth-child(2),[data-g=\"etapas\"] td:nth-child(3){display:inline-block;margin-right:18px}\n    [data-g=\"cmp\"] tbody tr{display:block;border-bottom:1px solid #E1DACE;padding:0 12px}\n    [data-g=\"cmp\"] td{display:block;text-align:left!important;white-space:normal!important;border-bottom:0!important;padding:2px 0!important}\n    [data-g=\"cmp\"] tbody tr>td:first-child{padding-top:12px!important}\n    [data-g=\"cmp\"] tbody tr>td:last-child{padding-bottom:12px!important;font-size:17px}\n    [data-g=\"gamas\"]{margin-left:0!important;margin-right:0!important}\n    [data-g=\"head\"]{display:block!important}\n    [data-g=\"head\"]>span{display:block}\n    [data-g=\"head\"]>span+span{margin-top:6px}\n    [data-g=\"duo\"]>div{padding:24px 0!important;border-right:0!important;border-bottom:1px solid #D5CEC2}\n    [data-g=\"duo\"]>div:last-child{border-bottom:0}\n    [data-g=\"idx\"]{gap:0!important}\n    [data-g=\"mock\"]{height:300px!important;margin-top:44px!important}\n    [data-g=\"mockwrap\"]{transform:scale(.55);transform-origin:top center}\n    [data-g=\"intro\"] h1{font-size:40px!important}\n  }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#EFEBE3;color:#15171A\">\n\n<sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-g=\"intro\" style=\"max-width:1180px;margin:0 auto;padding:72px 40px 96px\">\n  <div data-g=\"head\" style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #15171A;padding-bottom:18px;gap:16px;flex-wrap:wrap\">\n    <span style=\"font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase\">{{ marca }}<\u002Fspan>\n    <span style=\"font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#6B6660\">Asesoría preliminar · {{ fechaValor }}<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin:56px 0 18px;font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8A3B22\">Asesoría preliminar gratuita<\u002Fp>\n  <h1 style=\"margin:0;font-size:76px;line-height:.95;font-weight:900;letter-spacing:-.035em;max-width:18ch;text-wrap:balance\">Calculá cuántos m² necesita tu casa<\u002Fh1>\n  <p style=\"margin:32px 0 0;max-width:58ch;font-size:21px;line-height:1.5;color:#3A3A38\">Respondé algunas preguntas sobre cómo querés vivir y recibí un informe personalizado con los ambientes que necesitás, sus superficies y una primera referencia de inversión.<\u002Fp>\n  <p style=\"margin:20px 0 0;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6B6660\">≈ 10 minutos · Gratis · Informe personalizado<\u002Fp>\n\n  <h2 style=\"margin:56px 0 10px;font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;border-top:1px solid #D5CEC2;padding-top:40px\">¿Cómo imaginás la obra?<\u002Fh2>\n  <p style=\"margin:0 0 24px;max-width:56ch;font-size:16px;line-height:1.55;color:#4A4A46\">Elegí una opción y empezá el cuestionario.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:20px\">\n    <button sc-camel-on-click=\"{{ startA }}\" style=\"text-align:left;cursor:pointer;background:#F7F4EE;border:2px solid #15171A;padding:34px 32px 30px;display:flex;flex-direction:column;gap:12px;transition:transform .16s ease,box-shadow .16s ease\" style-hover=\"transform:translateY(-3px);box-shadow:10px 10px 0 #15171A\">\n      <span style=\"font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">En una sola obra<\u002Fspan>\n      <span style=\"font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.05\">Vivienda completa<\u002Fspan>\n      <span style=\"font-size:15px;line-height:1.55;color:#4A4A46\">Quiero proyectar la casa completa.<\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ startB }}\" style=\"text-align:left;cursor:pointer;background:#F7F4EE;border:2px solid #15171A;padding:34px 32px 30px;display:flex;flex-direction:column;gap:12px;transition:transform .16s ease,box-shadow .16s ease\" style-hover=\"transform:translateY(-3px);box-shadow:10px 10px 0 #15171A\">\n      <span style=\"font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">Por etapas<\u002Fspan>\n      <span style=\"font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.05\">Obra por etapas<\u002Fspan>\n      <span style=\"font-size:15px;line-height:1.55;color:#4A4A46\">Quiero proyectarla completa y organizar su construcción por etapas.<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n  <p style=\"margin:72px 0 6px;font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase\">Qué vas a recibir<\u002Fp>\n  <p style=\"margin:0 0 28px;max-width:60ch;font-size:16px;line-height:1.55;color:#4A4A46\">Un informe construido a partir de tus respuestas, no una plantilla genérica.<\u002Fp>\n  <div data-g=\"idx\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:0 48px;border-top:1px solid #D5CEC2\">\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #E1DACE\">\n        <span style=\"font-size:12px;font-weight:800;color:#8A3B22;min-width:22px;padding-top:3px\">01<\u002Fspan>\n        <div>\n          <div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Programa y superficies<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:#6B6660;margin-top:3px\">Ambiente por ambiente, con su equipamiento y superficie estimada.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #E1DACE\">\n        <span style=\"font-size:12px;font-weight:800;color:#8A3B22;min-width:22px;padding-top:3px\">02<\u002Fspan>\n        <div>\n          <div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Superficie real estimada<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:#6B6660;margin-top:3px\">Circulaciones, muros, espacios técnicos, exteriores y semicubiertos incluidos en el cálculo.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column\">\n      <div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #E1DACE\">\n        <span style=\"font-size:12px;font-weight:800;color:#8A3B22;min-width:22px;padding-top:3px\">03<\u002Fspan>\n        <div>\n          <div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Referencia preliminar de inversión<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:#6B6660;margin-top:3px\">Una estimación basada en valores CAUBA y una primera lectura de dónde podría concentrarse la inversión.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #E1DACE\">\n        <span style=\"font-size:12px;font-weight:800;color:#8A3B22;min-width:22px;padding-top:3px\">04<\u002Fspan>\n        <div>\n          <div style=\"font-size:17px;font-weight:800;letter-spacing:-.015em\">Lectura personalizada<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.5;color:#6B6660;margin-top:3px\">Observaciones sobre tus decisiones, construcción por etapas y qué quedará por definir según terreno, orientación y normativa.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-g=\"duo\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:0;margin:56px 0 0;border-top:1px solid #D5CEC2\">\n    <div style=\"padding:28px 32px 28px 0;border-right:1px solid #D5CEC2\">\n      <p style=\"margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">Lo hacés a tu ritmo<\u002Fp>\n      <p style=\"margin:0;font-size:16px;line-height:1.55;color:#3A3A38\">Lleva aproximadamente 10 minutos y tus respuestas quedan guardadas en este dispositivo para que puedas continuar después.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:28px 0 28px 32px\">\n      <p style=\"margin:0 0 12px;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">No es un cálculo genérico<\u002Fp>\n      <p style=\"margin:0;font-size:16px;line-height:1.55;color:#3A3A38\">Las superficies se estiman a partir del uso, el equipamiento y las dimensiones necesarias para cada ambiente, combinando referencias reconocidas con los criterios preliminares del estudio.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin: 56px 0 0; max-width: 74ch; font-size: 14px; line-height: 1.65; color: #6B6660; border-top: 1px solid #D5CEC2; padding-top: 0px; text-align: center; width: 100%; margin-left: auto; margin-right: auto\">Mientras respondés van a aparecer observaciones del estudio sobre algunas de tus elecciones. Son criterios preliminares que sirven para ayudarte a pensar mejor las decisiones que después se profundizan durante un proyecto.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAviso }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-g=\"aviso\" style=\"max-width:820px;margin:0 auto;padding:96px 40px\">\n  <p style=\"margin:0 0 14px;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8A3B22\">Obra por etapas<\u002Fp>\n  <h1 style=\"margin:0;font-size:52px;line-height:1.04;font-weight:900;letter-spacing:-.032em;max-width:24ch\">Empecemos por la casa terminada<\u002Fh1>\n  <p style=\"margin:26px 0 0;font-size:19px;line-height:1.55;color:#3A3A38;max-width:60ch\">Las preguntas que vienen son sobre la casa completa, con todos los ambientes, como la querés al final. Por ahora no pienses en qué se construye primero.<\u002Fp>\n  <p style=\"margin:20px 0 0;font-size:17px;line-height:1.6;color:#4A4A46;max-width:60ch\">Al final te preguntamos qué necesitás para poder mudarte y qué puede esperar un poco más. El orden de las etapas y sus previsiones técnicas los armamos nosotros: justamente por proyectar la casa completa desde el inicio se la puede construir por partes sin rehacer nada.<\u002Fp>\n  <div style=\"display:flex;gap:12px;align-items:center;margin-top:48px;border-top:2px solid #15171A;padding-top:26px\">\n    <button sc-camel-on-click=\"{{ continuarB }}\" style=\"cursor:pointer;background:#15171A;border:2px solid #15171A;color:#F7F4EE;padding:16px 34px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Comenzar<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ volverIntro }}\" style=\"cursor:pointer;background:transparent;border:2px solid #15171A;color:#15171A;padding:16px 26px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Volver<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-g=\"shell\" style=\"display:grid;grid-template-columns:288px minmax(0,1fr);align-items:start;min-height:100vh\">\n\n  <aside data-g=\"rail\" style=\"position:sticky;top:0;height:100vh;background:#15171A;color:#EFEBE3;padding:36px 28px;display:flex;flex-direction:column;gap:28px;overflow:auto\">\n    <div data-g=\"railhead\" style=\"display:flex;flex-direction:column;gap:6px\">\n      <span style=\"font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#C4B7A6\">{{ marca }}<\u002Fspan>\n      <span style=\"font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2\">Programador preliminar<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8A8378\">{{ modalidadLabel }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <div style=\"height:4px;background:#33342F\">\n        <div style=\"height:4px;background:#C86B45;width:{{ progressPct }}%;transition:width .3s ease\"><\u002Fdiv>\n      <\u002Fdiv>\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A8378\">Paso {{ stepNum }} de {{ stepTotal }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <nav data-g=\"nav\" style=\"display:flex;flex-direction:column;gap:2px\">\n      <sc-for list=\"{{ nav }}\" as=\"s\" hint-placeholder-count=\"9\">\n        <button sc-camel-on-click=\"{{ s.go }}\" data-active=\"{{ s.active }}\" style=\"text-align:left;cursor:pointer;background:{{ s.bg }};border:0;border-left:3px solid {{ s.mark }};padding:11px 14px;display:flex;gap:12px;align-items:baseline;color:{{ s.fg }}\">\n          <span style=\"font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.65;min-width:18px\">{{ s.num }}<\u002Fspan>\n          <span style=\"font-size:14px;font-weight:{{ s.weight }};line-height:1.3\">{{ s.title }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <div data-g=\"railfoot\" style=\"margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid #33342F;padding-top:18px\">\n      <span style=\"font-size:12px;line-height:1.5;color:#8A8378\">Guardamos lo que respondés en este dispositivo, así podés volver y cambiarlo.<\u002Fspan>\n      <button sc-camel-on-click=\"{{ goIntro }}\" style=\"cursor:pointer;background:transparent;color:#C4B7A6;border:1px solid #46473F;padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase\">Volver al inicio<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main data-g=\"content\" style=\"padding:56px 48px 120px;max-width:1240px\">\n    <div data-g=\"main\" style=\"display:grid;grid-template-columns:minmax(min(420px,100%),1fr) 320px;gap:56px;align-items:start\">\n      <div>\n        <p style=\"margin:0 0 14px;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8A3B22\">Bloque {{ stepNum }}<\u002Fp>\n        <h2 data-g=\"step-title\" style=\"margin:0;font-size:52px;line-height:1.02;font-weight:900;letter-spacing:-.032em;max-width:18ch;text-wrap:balance\">{{ stepTitle }}<\u002Fh2>\n        <p style=\"margin:18px 0 0;max-width:58ch;font-size:17px;line-height:1.55;color:#4A4A46\">{{ stepIntro }}<\u002Fp>\n\n        <div style=\"display:flex;flex-direction:column;gap:44px;margin-top:52px\">\n          <sc-for list=\"{{ fields }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;flex-direction:column;gap:14px;border-top:1px solid #D5CEC2;padding-top:22px\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <h3 style=\"margin:0;font-size:20px;font-weight:800;letter-spacing:-.015em\">{{ f.label }}<\u002Fh3>\n                <sc-if value=\"{{ f.help }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"margin:0;max-width:62ch;font-size:14px;line-height:1.55;color:#6B6660\">{{ f.help }}<\u002Fp>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ f.isOpts }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n                  <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ o.click }}\" style=\"cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;padding:13px 18px;min-height:48px;justify-content:center;border:2px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }};transition:all .12s ease\">\n                      <span style=\"font-size:15px;font-weight:700;letter-spacing:-.01em\">{{ o.label }}<\u002Fspan>\n                      <sc-if value=\"{{ o.hint }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"font-size:12px;font-weight:500;opacity:.72\">{{ o.hint }}<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ f.isCounts }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(276px,100%),1fr));gap:8px\">\n                  <sc-for list=\"{{ f.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;background:{{ it.bg }};border:1px solid {{ it.bd }};padding:10px 10px 10px 16px\">\n                      <div style=\"display:flex;flex-direction:column;gap:2px\">\n                        <span style=\"font-size:15px;font-weight:600\">{{ it.label }}<\u002Fspan>\n                        <sc-if value=\"{{ it.hint }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span style=\"font-size:12px;color:#6B6660\">{{ it.hint }}<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;gap:2px\">\n                        <button sc-camel-on-click=\"{{ it.dec }}\" style=\"cursor:pointer;width:44px;height:44px;border:1px solid #D5CEC2;background:#FFFFFF;font-size:20px;font-weight:700;color:#15171A;line-height:1\">−<\u002Fbutton>\n                        <span style=\"min-width:38px;text-align:center;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums\">{{ it.n }}<\u002Fspan>\n                        <button sc-camel-on-click=\"{{ it.inc }}\" style=\"cursor:pointer;width:44px;height:44px;border:1px solid #15171A;background:#15171A;color:#F7F4EE;font-size:20px;font-weight:700;line-height:1\">+<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ f.isText }}\" hint-placeholder-val=\"{{ false }}\">\n                <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onText }}\" placeholder=\"{{ f.placeholder }}\" style=\"width:100%;max-width:520px;padding:15px 18px;font-size:17px;font-weight:600;border:2px solid #D5CEC2;background:#FFFFFF;color:#15171A\">\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ f.isArea }}\" hint-placeholder-val=\"{{ false }}\">\n                <textarea value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onText }}\" placeholder=\"{{ f.placeholder }}\" rows=\"3\" style=\"width:100%;max-width:640px;padding:15px 18px;font-size:16px;line-height:1.5;font-weight:400;border:2px solid #D5CEC2;background:#FFFFFF;color:#15171A;resize:vertical\"><\u002Ftextarea>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ tieneNota }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:40px;background:#E4DED2;border-left:4px solid #8A3B22;padding:22px 24px\">\n            <p style=\"margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8A3B22\">Lo resolvemos nosotros<\u002Fp>\n            <p style=\"margin:0;max-width:62ch;font-size:15px;line-height:1.55;color:#2C2E30\">{{ stepNota }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;gap:12px;align-items:center;margin-top:56px;border-top:2px solid #15171A;padding-top:24px\">\n          <button sc-camel-on-click=\"{{ prev }}\" style=\"cursor:pointer;background:transparent;border:2px solid #15171A;color:#15171A;padding:15px 26px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Anterior<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ next }}\" style=\"cursor:pointer;background:#15171A;border:2px solid #15171A;color:#F7F4EE;padding:15px 34px;font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">{{ nextLabel }}<\u002Fbutton>\n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <aside data-g=\"aside\" style=\"position:sticky;top:56px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"background:#15171A;color:#EFEBE3;padding:24px 22px\">\n          <p style=\"margin:0 0 14px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#C4B7A6\">Estimación en curso<\u002Fp>\n          <div style=\"font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums\">{{ cubRange }}<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A8378;margin-top:6px\">m² cubiertos estimados<\u002Fdiv>\n          <div style=\"display:flex;gap:22px;margin-top:20px;border-top:1px solid #33342F;padding-top:16px\">\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <span style=\"font-size:20px;font-weight:800;font-variant-numeric:tabular-nums\">{{ semiRange }}<\u002Fspan>\n              <span style=\"font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A8378\">m² semicub.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <span style=\"font-size:20px;font-weight:800;font-variant-numeric:tabular-nums\">{{ ambCount }}<\u002Fspan>\n              <span style=\"font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8A8378\">Ambientes<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#F7F4EE;border:1px solid #D5CEC2;padding:22px\">\n          <p style=\"margin:0 0 14px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">Observaciones<\u002Fp>\n          <sc-if value=\"{{ hasNotes }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:16px\">\n              <sc-for list=\"{{ notes }}\" as=\"n\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;flex-direction:column;gap:5px;animation:rise .3s ease both\">\n                  <span style=\"font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A8378\">{{ n.tipo }}<\u002Fspan>\n                  <span style=\"font-size:14px;line-height:1.5;color:#2C2E30\">{{ n.texto }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noNotes }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:14px;line-height:1.5;color:#6B6660\">A medida que respondas vamos a ir comentando lo que tus elecciones tienen que ver entre sí.<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <p style=\"margin:0;font-size:12px;line-height:1.5;color:#8A8378\">Son rangos preliminares: todavía no verifican normativa ni son un presupuesto.<\u002Fp>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDatos }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-g=\"result\" style=\"max-width:900px;margin:0 auto;padding:64px 40px 110px\">\n  <div data-g=\"head\" style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #15171A;padding-bottom:16px;gap:14px;flex-wrap:wrap\">\n    <span style=\"font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase\">{{ marca }}<\u002Fspan>\n    <button sc-camel-on-click=\"{{ volverForm }}\" style=\"cursor:pointer;background:transparent;border:0;color:#8A3B22;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:underline\">Volver y editar<\u002Fbutton>\n  <\u002Fdiv>\n  <p style=\"margin:46px 0 0;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8A3B22\">Tu informe está listo<\u002Fp>\n  <div data-g=\"pad\" style=\"margin-top:0;border:2px solid #15171A;background:#F7F4EE;padding:44px 40px\">\n    <h2 style=\"margin:0;font-size:34px;font-weight:900;letter-spacing:-.028em;max-width:20ch\">Recibí el análisis de tu proyecto<\u002Fh2>\n    <p style=\"margin:14px 0 0;max-width:62ch;font-size:16px;line-height:1.55;color:#4A4A46\">Armamos un informe personalizado a partir de tus respuestas, con el programa recomendado, superficies estimadas y algunas observaciones para ayudarte a ordenar las primeras decisiones de tu vivienda.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:22px 40px;margin-top:26px;border-top:1px solid #D5CEC2;padding-top:22px\">\n      <div style=\"display:flex;flex-direction:column\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22;margin-bottom:12px\">Tu programa preliminar<\u002Fspan>\n        <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5;color:#3A3A38\">\n          <li>Los ambientes que podría necesitar tu vivienda y sus superficies estimadas.<\u002Fli>\n          <li>La superficie cubierta y los espacios exteriores.<\u002Fli>\n          <li>Una primera referencia de la superficie total y la escala de inversión.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22;margin-bottom:12px\">Nuestras observaciones<\u002Fspan>\n        <ul style=\"margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5;color:#3A3A38\">\n          <li>Las decisiones que aparecen como prioritarias según tus respuestas.<\u002Fli>\n          <li>Cómo podría organizarse el proyecto si necesitás construir por etapas.<\u002Fli>\n          <li>Qué variables deberán verificarse al conocer el terreno, la orientación y la normativa.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px;margin-top:34px\">\n      <label style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">Nombre y apellido<\u002Fspan>\n        <input value=\"{{ cNombre }}\" sc-camel-on-change=\"{{ onNombre }}\" placeholder=\"Nombre y apellido\" style=\"padding:14px 16px;font-size:16px;font-weight:600;border:2px solid #D5CEC2;background:#FFFFFF;color:#15171A\">\n      <\u002Flabel>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">¿Cómo querés recibirlo?<\u002Fspan>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <sc-for list=\"{{ medios }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ m.click }}\" style=\"cursor:pointer;padding:13px 20px;min-height:48px;font-size:15px;font-weight:700;border:2px solid {{ m.bd }};background:{{ m.bg }};color:{{ m.fg }}\">{{ m.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ pideCorreo }}\" hint-placeholder-val=\"{{ false }}\">\n        <label style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">Correo<\u002Fspan>\n          <input value=\"{{ cCorreo }}\" sc-camel-on-change=\"{{ onCorreo }}\" placeholder=\"nombre@correo.com\" style=\"padding:14px 16px;font-size:16px;font-weight:600;border:2px solid #D5CEC2;background:#FFFFFF;color:#15171A\">\n        <\u002Flabel>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ pideWa }}\" hint-placeholder-val=\"{{ false }}\">\n        <label style=\"display:flex;flex-direction:column;gap:8px\">\n          <span style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">WhatsApp<\u002Fspan>\n          <input value=\"{{ cWa }}\" sc-camel-on-change=\"{{ onWa }}\" placeholder=\"+54 9 ...\" style=\"padding:14px 16px;font-size:16px;font-weight:600;border:2px solid #D5CEC2;background:#FFFFFF;color:#15171A\">\n        <\u002Flabel>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <button sc-camel-on-click=\"{{ toggleComercial }}\" style=\"cursor:pointer;display:flex;align-items:flex-start;gap:12px;background:transparent;border:0;padding:24px 0 0;text-align:left\">\n      <span style=\"width:24px;height:24px;flex:none;border:2px solid #15171A;background:{{ comercialBg }};color:#F7F4EE;font-size:15px;font-weight:900;line-height:20px;text-align:center\">{{ comercialMark }}<\u002Fspan>\n      <span style=\"font-size:15px;line-height:1.5;color:#3A3A38;max-width:60ch\">Me gustaría que me escriban para conversar sobre mi proyecto. Es opcional y sólo nos pondremos en contacto si marcás esta casilla.<\u002Fspan>\n    <\u002Fbutton>\n\n    <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:28px\">\n      \n      <button sc-camel-on-click=\"{{ enviar }}\" style=\"cursor:pointer;background:#15171A;border:2px solid #15171A;color:#F7F4EE;padding:17px 38px;font-size:15px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Ver mi informe<\u002Fbutton>\n      <span style=\"font-size:14px;font-weight:600;color:{{ envioColor }}\">{{ envioMsg }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <p style=\"margin:28px 0 0;max-width:78ch;font-size:12px;line-height:1.65;color:#6B6660;border-top:1px solid #D5CEC2;padding-top:18px\">Tus datos se utilizan únicamente para generar y enviarte este informe. Sólo nos pondremos en contacto con vos si marcás la opción anterior.<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isInforme }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#EFEBE3;padding:0 0 80px\">\n  <div data-om-noprint=\"1\" style=\"position:sticky;top:0;z-index:5;background:#15171A;color:#EFEBE3;padding:16px 32px;display:flex;gap:14px;align-items:center;flex-wrap:wrap\">\n    <span style=\"font-size:13px;font-weight:700;letter-spacing:.04em\">Tu informe está listo.<\u002Fspan>\n    <button sc-camel-on-click=\"{{ imprimir }}\" style=\"cursor:pointer;background:#C86B45;border:0;color:#15171A;padding:11px 22px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase\">Descargar en PDF<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ volverResultado }}\" style=\"cursor:pointer;background:transparent;border:1px solid #46473F;color:#C4B7A6;padding:11px 18px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase\">Volver<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div data-g=\"inf\" style=\"max-width:860px;margin:0 auto;background:#FFFFFF;padding:64px 68px;color:#15171A\">\n    <div data-g=\"infhead\" style=\"border-bottom:3px solid #15171A;padding-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap\">\n      <span style=\"font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase\">{{ marca }}<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6660\">Informe preliminar · {{ infFecha }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <p style=\"margin:38px 0 10px;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#8A3B22\">Programa preliminar de vivienda<\u002Fp>\n    <h1 style=\"margin:0;font-size:44px;line-height:1.02;font-weight:900;letter-spacing:-.03em;max-width:20ch\">Tu programa, en superficie y decisiones<\u002Fh1>\n    <p style=\"margin:18px 0 0;font-size:16px;line-height:1.55;color:#3A3A38;max-width:62ch\">{{ aperturaTexto }}<\u002Fp>\n\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;margin:32px 0 0;font-size:14px\">\n      <sc-raw-tbody>\n        <sc-for list=\"{{ infResumen }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;font-weight:600;color:#6B6660;width:34%\">{{ r.label }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;font-weight:700\">{{ r.valor }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h2 style=\"margin:46px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">1. Programa y superficies<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Cada ambiente se estima como rango, según su equipamiento y el nivel de amplitud elegido. El nivel que elegiste ya define el tamaño, así que el rango es acotado: alrededor de un 10% entre el mínimo y el máximo, lo que el proyecto puede mover al resolver la planta. Son medidas interiores libres: orientan el proyecto, no lo reemplazan.<\u002Fp>\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n      <sc-raw-thead>\n        <sc-raw-tr>\n          <sc-raw-th style=\"text-align:left;padding:8px 0;border-bottom:2px solid #15171A;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">Ambiente<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:left;padding:8px 0;border-bottom:2px solid #15171A;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">Según lo que indicaste<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:right;padding:8px 0;border-bottom:2px solid #15171A;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap\">m²<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ infRooms }}\" as=\"r\" hint-placeholder-count=\"8\">\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700\">{{ r.name }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">{{ r.equip }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ r.m2 }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n        <sc-raw-tr>\n          <sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;font-weight:900\">Superficie útil<\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A\"><\u002Fsc-raw-td>\n          <sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;text-align:right;font-weight:900;white-space:nowrap\">{{ infUtil }}<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">2. De superficie útil a superficie cubierta<\u002Fh2>\n    <p style=\"margin:0 0 18px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">A los ambientes se suma lo que la casa necesita para funcionar y sostenerse. Estos son los supuestos aplicados en tu caso.<\u002Fp>\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700;width:40%\">Circulaciones<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">{{ infCircPct }} de la superficie útil<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ infCirc }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700\">Muros<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">{{ infMurPct }}, según envolvente y sistema constructivo<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ infMuros }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700\">Escalera<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">Según la circulación vertical indicada<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ infEsc }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700\">Ascensor<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">Sólo si se instala desde el inicio<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ infAsc }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700\">Espacios técnicos<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">Tableros, tanques y equipos según los sistemas elegidos<\u002Fsc-raw-td><sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ infTec }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;font-weight:900\">Superficie cubierta estimada<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A\"><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;text-align:right;font-weight:900;white-space:nowrap\">{{ infCub }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <sc-if value=\"{{ haySemis }}\" hint-placeholder-val=\"{{ true }}\">\n      <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ nSemis }}. Exteriores y semicubiertos<\u002Fh2>\n      <p style=\"margin:0 0 18px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Un semicubierto no cuesta lo mismo que un ambiente cerrado ni lo mismo que un piso de patio. Se computa con un factor según cuánto se acerque a un ambiente terminado.<\u002Fp>\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n        <sc-raw-tbody>\n          <sc-for list=\"{{ infSemis }}\" as=\"s\" hint-placeholder-count=\"2\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700;width:34%\">{{ s.name }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">{{ s.config }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap\">{{ s.m2 }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n          <sc-raw-tr>\n            <sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;font-weight:900\">Total semicubierto<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;color:#4A4A46\">Equivale a {{ infSemiEq }} m² cubiertos a efectos de costo<\u002Fsc-raw-td>\n            <sc-raw-td style=\"padding:10px 0;border-bottom:2px solid #15171A;text-align:right;font-weight:900;white-space:nowrap\">{{ infSemiTotal }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ mostrarCosto }}\" hint-placeholder-val=\"{{ true }}\">\n      <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ nCosto }}. Referencia preliminar de inversión<\u002Fh2>\n      <p style=\"margin:0 0 16px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Los metros cuadrados determinan el tamaño de la vivienda, pero no definen por sí solos cuánto cuesta construirla. El costo por m² cambia según terminaciones, aberturas, instalaciones, climatización, equipamiento y nivel de personalización.<\u002Fp>\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:0 0 16px\">\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td style=\"padding:8px 0;border-bottom:1px solid #E1DACE;font-weight:600;color:#6B6660;width:44%\">Superficie computable estimada<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 0;border-bottom:1px solid #E1DACE;font-weight:800\">{{ supComputable }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:8px 0;border-bottom:1px solid #E1DACE;font-weight:600;color:#6B6660\">Gama seleccionada<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 0;border-bottom:1px solid #E1DACE;font-weight:800\">{{ gamaNombre }} · {{ gamaSub }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding:8px 0;border-bottom:1px solid #E1DACE;font-weight:600;color:#6B6660\">Referencia de esa gama<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 0;border-bottom:1px solid #E1DACE;font-weight:800\">{{ gamaValorLinea }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <div style=\"background:#15171A;color:#EFEBE3;padding:26px 28px;margin:0 0 20px\">\n        <div style=\"font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#C4B7A6\">Inversión preliminar estimada<\u002Fdiv>\n        <div data-g=\"costo\" style=\"font-size:36px;font-weight:900;letter-spacing:-.035em;line-height:1.05;margin-top:6px\">{{ costoRange }}<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.55;color:#A9A296;margin-top:12px;max-width:70ch\">Esta estimación combina la superficie computable de tu programa con el nivel de terminaciones y prestaciones seleccionado. No constituye un presupuesto de obra. No incluye terreno, honorarios ni conceptos no definidos expresamente.{{ notaPileta }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 style=\"margin:28px 0 6px;font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">¿Qué supone esta gama?<\u002Fh3>\n      <p style=\"margin:0 0 14px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">{{ gamaNombre }}: {{ gamaDesc }}<\u002Fp>\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px;margin:0 0 26px\">\n        <sc-raw-tbody>\n          <sc-for list=\"{{ gamaDesglose }}\" as=\"d\" hint-placeholder-count=\"8\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700;width:32%;vertical-align:top\">{{ d.cat }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;color:#4A4A46;line-height:1.5\">{{ d.texto }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n\n      <h3 style=\"margin:0 0 6px;font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">La misma superficie, cinco niveles de inversión<\u002Fh3>\n      <p style=\"margin:0 0 14px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Para que puedas dimensionar cuánto inciden las decisiones de terminaciones y equipamiento, aplicamos las cinco referencias a la misma superficie de tu programa.<\u002Fp>\n      <sc-raw-table data-g=\"cmp\" style=\"width:calc(100% + 24px);border-collapse:collapse;font-size:14px;margin:0 -12px 18px\">\n        <sc-raw-tbody>\n          <sc-for list=\"{{ gamaComparacion }}\" as=\"g\" hint-placeholder-count=\"5\">\n            <sc-raw-tr style=\"background:{{ g.bg }};color:{{ g.fg }}\">\n              <sc-raw-td style=\"padding:9px 10px 9px 12px;border-bottom:1px solid #E1DACE;vertical-align:top\">\n                <div style=\"font-weight:900\">{{ g.nombre }}<\u002Fdiv>\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:{{ g.sub }};margin-top:2px\">{{ g.etiqueta }}<\u002Fdiv>\n              <\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #E1DACE;white-space:nowrap;color:{{ g.sub }};font-weight:700;vertical-align:top\">{{ g.valorM2 }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:9px 12px 9px 10px;border-bottom:1px solid #E1DACE;text-align:right;font-weight:900;white-space:nowrap;vertical-align:top\">{{ g.total }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <sc-if value=\"{{ hayReserva }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0 0 14px;font-size:13px;line-height:1.55;color:#6B6660;max-width:70ch\">Las cinco cifras incluyen la reserva de {{ infReserva }} por construir en etapas, igual que el total de arriba.<\u002Fp>\n      <\u002Fsc-if>\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px;margin:0 0 24px\">\n        <sc-raw-tbody>\n          <sc-for list=\"{{ gamaSaltos }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:6px 0;border-bottom:1px solid #E1DACE;font-weight:700;width:34%\">{{ s.paso }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:6px 0;border-bottom:1px solid #E1DACE;color:#4A4A46\">{{ s.porM2 }} · {{ s.total }}<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n\n      <div style=\"background:#F7F4EE;border-left:3px solid #8A3B22;padding:20px 22px;margin:0 0 26px\">\n        <p style=\"margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22\">Los m² no definen solos el costo<\u002Fp>\n        <p style=\"margin:0;font-size:14px;line-height:1.55;color:#2C2E30;max-width:70ch\">La superficie define la escala de la vivienda. El costo final depende también de qué colocamos dentro de esos metros: aberturas, terminaciones, instalaciones, climatización, equipamiento, complejidad constructiva y nivel de personalización.<\u002Fp>\n        <p style=\"margin:10px 0 0;font-size:14px;line-height:1.55;color:#2C2E30;max-width:70ch\">Por eso esta herramienta separa dos decisiones diferentes: cuánta superficie necesita tu programa y con qué nivel de prestaciones imaginás construirla.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #D5CEC2;padding:20px 22px;margin:0 0 26px\">\n        <p style=\"margin:0 0 6px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22\">Referencia institucional<\u002Fp>\n        <p style=\"margin:0 0 3px;font-size:14px;font-weight:700\">Valor de referencia publicado por CAUBA<\u002Fp>\n        <p style=\"margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ caubaLinea }}<\u002Fp>\n        <p style=\"margin:5px 0 0;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6B6660\">{{ caubaFuente }}<\u002Fp>\n        <p style=\"margin:14px 0 0;font-size:13px;line-height:1.6;color:#4A4A46;max-width:72ch\">Este valor se muestra como referencia institucional del costo de construcción. No se utiliza como único parámetro para estimar tu vivienda, porque dos obras de igual superficie pueden tener costos diferentes según sus terminaciones, instalaciones, equipamiento y nivel de complejidad. El dato es público: <a href=\"https://www.capbacs.com/indicadores-cauba\" target=\"_blank\" rel=\"noopener\">capbacs.com/indicadores-cauba<\u002Fa>.<\u002Fp>\n        <p style=\"margin:12px 0 0;font-size:12px;line-height:1.65;color:#6B6660;border-top:1px solid #E1DACE;padding-top:12px;max-width:74ch\">Los valores son orientativos y sirven para dimensionar órdenes de magnitud en una etapa preliminar. El costo real de una obra depende, entre otros factores, de su ubicación, sistema constructivo, características del terreno, proyecto definitivo, proveedores, contratistas, condiciones de contratación y momento de ejecución. Las gamas Base, Media, Media alta, Alta y Premium son referencias propias del estudio y no valores publicados por CAUBA.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 16px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Dónde se concentraría la inversión, según tus decisiones. Los porcentajes parten de una distribución de referencia y se ajustan por cantidad de baños, plantas, nivel de terminación e instalaciones.<\u002Fp>\n      <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n        <sc-raw-tbody>\n          <sc-for list=\"{{ incidencias }}\" as=\"i\" hint-placeholder-count=\"6\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;font-weight:700;width:70%\">{{ i.grupo }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:7px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:800\">{{ i.pct }}%<\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <sc-if value=\"{{ hayReserva }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:14px 0 0;font-size:13px;line-height:1.55;color:#6B6660;max-width:70ch\">Incluye una reserva de {{ infReserva }} por construir en etapas: cada arranque y cierre de obra tiene costos propios que no existen en una obra continua.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hayEtapas }}\" hint-placeholder-val=\"{{ false }}\">\n      <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ nEtapas }}. Cómo se reparte entre etapas<\u002Fh2>\n      <p style=\"margin:0 0 8px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">{{ etapasNota }}<\u002Fp>\n      <p style=\"margin:0 0 18px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">{{ etapasNotaAnticipo }}<\u002Fp>\n      <sc-raw-table data-g=\"etapas\" style=\"width:100%;border-collapse:collapse;font-size:14px\">\n        <sc-raw-thead>\n          <sc-raw-tr>\n            <sc-raw-th style=\"text-align:left;padding:8px 0;border-bottom:2px solid #15171A;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase\">Etapa<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:right;padding:8px 0;border-bottom:2px solid #15171A;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap\">Superficie<\u002Fsc-raw-th>\n            <sc-raw-th style=\"text-align:right;padding:8px 0;border-bottom:2px solid #15171A;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap\">Inversión<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ etapasFilas }}\" as=\"e\" hint-placeholder-count=\"2\">\n            <sc-raw-tr>\n              <sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;vertical-align:top\">\n                <div style=\"font-weight:800\">{{ e.titulo }}<\u002Fdiv>\n                <div style=\"font-size:13px;line-height:1.45;color:#4A4A46;margin-top:2px\">{{ e.ambientes }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#8A3B22;font-weight:700;margin-top:3px\">{{ e.nota }}<\u002Fdiv>\n              <\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;text-align:right;font-weight:700;white-space:nowrap;vertical-align:top\">{{ e.m2 }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;text-align:right;vertical-align:top;white-space:nowrap\">\n                <div style=\"font-weight:900\">{{ e.pct }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#6B6660;margin-top:2px\">{{ e.monto }}<\u002Fdiv>\n              <\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n      <p style=\"margin:14px 0 0;font-size:13px;line-height:1.55;color:#6B6660;max-width:70ch\">Los semicubiertos figuran en la etapa que los recibe, computados con su factor, igual que en el total. El reparto es una lectura preliminar del programa que cargaste, no un plan de obra. La secuencia definitiva se define en el anteproyecto, junto con el terreno y la normativa.<\u002Fp>\n    <\u002Fsc-if>\n\n    <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ nLectura }}. Lectura de tu programa<\u002Fh2>\n    <p style=\"margin:0 0 20px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Cada observación surge de una combinación concreta de tus respuestas. No indican una solución: señalan qué conviene definir y por qué.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <sc-for list=\"{{ topNotes }}\" as=\"n\" hint-placeholder-count=\"4\">\n        <div style=\"border-left:3px solid #8A3B22;padding-left:16px\">\n          <div style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22;margin-bottom:4px\">{{ n.tipo }}<\u002Fdiv>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:#2C2E30\">{{ n.texto }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ nFalta }}. Qué falta definir<\u002Fh2>\n    <p style=\"margin:0 0 14px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Estas decisiones no pueden resolverse sin conocer el terreno. Van listadas para que lleguen ordenadas a la primera conversación.<\u002Fp>\n    <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.55;color:#3A3A38;max-width:70ch\">\n      <li>Orientación del lote y ubicación de los espacios de día respecto del sol.<\u002Fli>\n      <li>Retiros, altura máxima y factor de ocupación según la normativa local.<\u002Fli>\n      <li>Sistema constructivo y su efecto sobre plazos, espesores y terminaciones.<\u002Fli>\n      <li>Estudio de suelo, que define fundaciones y una parte importante de la obra gruesa.<\u002Fli>\n      <li>Nivel de terminación esperado, que mueve el rubro de mayor variación del costo.<\u002Fli>\n    <\u002Ful>\n\n    <h2 style=\"margin:44px 0 6px;font-size:22px;font-weight:900;letter-spacing:-.02em\">{{ nSigue }}. Cómo seguimos<\u002Fh2>\n    <p style=\"margin:0 0 16px;font-size:14px;line-height:1.55;color:#4A4A46;max-width:66ch\">Trabajamos en tres niveles. Cada uno se apoya en las decisiones del anterior, y al terminar cada uno decidís si seguís.<\u002Fp>\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;font-weight:800;width:24%;vertical-align:top\">Nivel 1<br><span style=\"font-weight:600;color:#6B6660;font-size:13px\">Anteproyecto<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;color:#3A3A38;line-height:1.5\">Concepto, implantación, funcionamiento, imagen y la superficie real de la casa. Plantas, cortes y vistas, renders ilustrativos y lista de cantidades. 30 días hábiles.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;font-weight:800;vertical-align:top\">Nivel 2<br><span style=\"font-weight:600;color:#6B6660;font-size:13px\">Proyecto<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;color:#3A3A38;line-height:1.5\">Documentación en 1:50 con ejes y niveles, renders realistas, predimensionado de estructura, materialidad y planilla de aberturas. 40 días hábiles.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;font-weight:800;vertical-align:top\">Nivel 3<br><span style=\"font-weight:600;color:#6B6660;font-size:13px\">Legajo<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 0;border-bottom:1px solid #E1DACE;color:#3A3A38;line-height:1.5\">La documentación ejecutiva con la que se construye: estructura, replanteos, instalaciones y lista de materiales. 20 días hábiles.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n\n    <div style=\"background:#F7F4EE;border-left:3px solid #8A3B22;padding:22px 24px;margin:30px 0 0\">\n      <p style=\"margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22\">Nuestra manera<\u002Fp>\n      <p style=\"margin:0;font-size:15px;line-height:1.5;font-weight:700;max-width:52ch\">La arquitectura no comienza dibujando una forma. Comienza comprendiendo un problema.<\u002Fp>\n      <p style=\"margin:12px 0 0;font-size:14px;line-height:1.55;color:#3A3A38;max-width:70ch\">Por eso empezamos escuchando: este formulario es parte de ese trabajo. Y por eso el proceso tiene estructura, para que en cada paso sepas qué se está definiendo, cuándo nos volvemos a reunir y con qué tema. La belleza no la agregamos al final: aparece cuando el diseño nace del rigor técnico y la claridad conceptual.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin:34px 0 0;border-top:1px solid #D5CEC2;padding-top:20px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n      <span style=\"font-size:13px;font-weight:700\">{{ marca }}<\u002Fspan>\n      <span style=\"font-size:13px;color:#6B6660\">{{ email }}<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:14px 0 0;font-size:12px;line-height:1.6;color:#8A8378;max-width:78ch\">Este informe organiza necesidades y estima superficies a partir de referencias dimensionales y ergonómicas, incluyendo Neufert, y de criterios preliminares del estudio. No define la mejor distribución, no verifica normativa ni constituye un presupuesto definitivo.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-g=\"result\" style=\"max-width:1180px;margin:0 auto;padding:64px 40px 110px\">\n  <div data-g=\"head\" style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #15171A;padding-bottom:16px;gap:14px;flex-wrap:wrap\">\n    <span style=\"font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase\">{{ marca }}<\u002Fspan>\n    <button sc-camel-on-click=\"{{ backToForm }}\" style=\"cursor:pointer;background:transparent;border:0;color:#8A3B22;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:underline\">Volver y editar<\u002Fbutton>\n  <\u002Fdiv>\n\n  <p style=\"margin:52px 0 14px;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#8A3B22\">Tu resultado<\u002Fp>\n  <h1 style=\"margin:0;max-width:22ch;font-size:64px;line-height:1;font-weight:900;letter-spacing:-.035em\">Tu programa preliminar<\u002Fh1>\n  <p style=\"margin:26px 0 0;max-width:64ch;font-size:19px;line-height:1.55;color:#3A3A38\">{{ aperturaTexto }}<\u002Fp>\n\n  <sc-if value=\"{{ haySintesis }}\" hint-placeholder-val=\"{{ true }}\">\n  <div data-g=\"stats\" style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#D5CEC2;border:1px solid #D5CEC2;margin-top:48px\">\n    <sc-for list=\"{{ sintesis }}\" as=\"s\" hint-placeholder-count=\"4\">\n      <div style=\"background:#F7F4EE;padding:26px 24px;display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:36px;font-weight:900;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums\">{{ s.valor }}<\u002Fspan>\n        <span style=\"font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#6B6660\">{{ s.label }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:48px;margin-top:64px\">\n    <div>\n      <h2 style=\"margin:0 0 20px;font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid #D5CEC2;padding-bottom:12px\">Lo que vemos en tu programa<\u002Fh2>\n      <sc-if value=\"{{ noTopNotes }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0 0 22px;font-size:16px;line-height:1.55;color:#4A4A46\">Con lo que respondiste hasta ahora, el programa no presenta tensiones evidentes. Al completar más bloques del cuestionario aparecerán observaciones que relacionan sus decisiones.<\u002Fp>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <sc-for list=\"{{ topNotes }}\" as=\"n\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8A3B22\">{{ n.tipo }}<\u002Fspan>\n            <span style=\"font-size:16px;line-height:1.55;color:#2C2E30\">{{ n.texto }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <h2 style=\"margin:0 0 20px;font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid #D5CEC2;padding-bottom:12px\">Dónde se iría la inversión<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:10
